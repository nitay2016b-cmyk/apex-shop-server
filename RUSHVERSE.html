<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RUSHVERSE</title>
<meta name="description" content="RUSHVERSE — fast-paced third-person arena action for mobile.">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060810">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%237c4dff'/%3E%3Cpath d='M30 70 L55 30 L48 30 L70 30 L45 70 Z' fill='%2300e5ff'/%3E%3C/svg%3E">
<style>
/* RUSHVERSE - css/style.css */
:root {
  --bg: #060810;
  --panel: rgba(18, 22, 36, 0.86);
  --panel-light: rgba(30, 36, 56, 0.9);
  --accent: #7c4dff;
  --accent2: #ff3bd6;
  --cyan: #00e5ff;
  --gold: #ffce45;
  --green: #7dff5a;
  --red: #ff3860;
  --text: #eef2ff;
  --text-dim: #8fa0c0;
  --radius: 16px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: var(--bg);
  font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  color: var(--text); user-select: none; touch-action: none; overscroll-behavior: none;
}
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
input { font-family: inherit; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; background:
  radial-gradient(circle at 20% -10%, #241a4a 0%, transparent 55%),
  radial-gradient(circle at 90% 110%, #4a1440 0%, transparent 50%), var(--bg); }

/* ---------- Top header (currency / level) ---------- */
#topHeader {
  display: flex; align-items: center; gap: 8px; padding: calc(10px + var(--safe-top)) 14px 10px;
  flex-shrink: 0; z-index: 30; transition: opacity 0.2s, transform 0.2s;
}
#topHeader.hidden { opacity: 0; pointer-events: none; transform: translateY(-10px); }
.curr-pill {
  display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; backdrop-filter: blur(8px);
}
.coin-pill .curr-icon { color: var(--gold); }
.gem-pill .curr-icon { color: var(--cyan); }
.level-block { flex: 1; display: flex; align-items: center; gap: 8px; }
.level-badge {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); padding: 5px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 800; letter-spacing: 0.5px; flex-shrink: 0;
}
.xp-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--accent)); transition: width 0.4s ease; }

/* ---------- Stage / screens ---------- */
#stage { position: relative; flex: 1; overflow: hidden; }
.screen {
  position: absolute; inset: 0; opacity: 0; pointer-events: none; transform: translateY(14px);
  transition: opacity 0.28s ease, transform 0.28s ease; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: calc(20px + var(--safe-bottom));
}
.screen.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
.game-screen.active { overflow: hidden; }

/* ---------- Bottom nav ---------- */
#bottomNav {
  display: flex; flex-shrink: 0; background: var(--panel); border-top: 1px solid rgba(255,255,255,0.06);
  padding: 6px 4px calc(6px + var(--safe-bottom)); backdrop-filter: blur(10px); z-index: 30; transition: opacity 0.2s, transform 0.2s;
}
#bottomNav.hidden { opacity: 0; pointer-events: none; transform: translateY(10px); }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--text-dim); transition: color 0.15s, transform 0.1s; }
.nav-btn.active { color: var(--cyan); }
.nav-btn:active { transform: scale(0.92); }
.nav-icon { font-size: 18px; }
.nav-label { font-size: 9px; font-weight: 700; letter-spacing: 0.4px; }
.nav-home .nav-icon { font-size: 22px; color: var(--gold); }

/* ---------- Home screen ---------- */
.home-screen { display: flex; flex-direction: column; align-items: center; padding-top: 6vh; }
.home-glow {
  position: absolute; top: -20%; left: 50%; width: 140%; height: 60%; transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(124,77,255,0.35), transparent 65%); pointer-events: none;
}
.logo-wrap { text-align: center; margin-bottom: 4vh; animation: floatLogo 4s ease-in-out infinite; }
@keyframes floatLogo { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.logo-title { font-size: 42px; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 24px rgba(124,77,255,0.7); }
.logo-accent { background: linear-gradient(90deg, var(--cyan), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo-sub { font-size: 12px; letter-spacing: 6px; color: var(--text-dim); margin-top: 4px; }

.picker-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; width: 100%; max-width: 380px; padding: 0 12px; }
.picker-arrow { background: var(--panel); width: 38px; height: 38px; border-radius: 50%; font-size: 16px; flex-shrink: 0; }
.picker-arrow:active { transform: scale(0.9); }
.picker-card { flex: 1; background: var(--panel); border-radius: var(--radius); padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.06); }
.char-avatar { width: 56px; height: 68px; border-radius: 50% 50% 45% 45%; margin: 0 auto 8px; box-shadow: 0 0 20px rgba(124,77,255,0.5); }
.map-avatar { width: 100%; height: 46px; border-radius: 10px; margin-bottom: 8px; position: relative; overflow: hidden; }
.map-avatar-glow { position: absolute; bottom: -10px; left: 20%; width: 60%; height: 30px; border-radius: 50%; filter: blur(14px); opacity: 0.6; }
.picker-name { font-weight: 800; font-size: 15px; }
.picker-sub { font-size: 10px; font-weight: 700; letter-spacing: 1px; margin: 2px 0; }
.picker-desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; min-height: 28px; }

.play-btn {
  margin-top: 12px; width: 200px; height: 64px; border-radius: 999px; font-size: 24px; font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(135deg, var(--cyan), var(--accent) 55%, var(--accent2)); color: #fff;
  box-shadow: 0 8px 30px rgba(124,77,255,0.55), inset 0 2px 0 rgba(255,255,255,0.3);
  animation: pulsePlay 2.2s ease-in-out infinite;
}
@keyframes pulsePlay { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
.play-btn:active { transform: scale(0.94); }
.best-score-line { margin-top: 14px; font-size: 12px; letter-spacing: 2px; color: var(--text-dim); font-weight: 700; }

/* ---------- Generic screen chrome ---------- */
.screen-title { font-size: 22px; font-weight: 900; letter-spacing: 2px; text-align: center; padding: 18px 0 10px; }
.tab-row { display: flex; gap: 6px; padding: 0 12px 12px; overflow-x: auto; }
.tab-btn { flex-shrink: 0; padding: 8px 16px; border-radius: 999px; background: var(--panel); font-weight: 700; font-size: 12px; letter-spacing: 0.5px; color: var(--text-dim); border: 1px solid rgba(255,255,255,0.06); }
.tab-btn.active { background: linear-gradient(135deg, var(--accent), var(--cyan)); color: #fff; }

/* ---------- Item grid / shop ---------- */
.item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px 20px; }
.item-card { background: var(--panel); border-radius: var(--radius); padding: 12px; text-align: center; border: 2px solid rgba(255,255,255,0.06); }
.rarity-border-common { border-color: #9aa5b1; }
.rarity-border-uncommon { border-color: #5fd97a; }
.rarity-border-rare { border-color: #4fa8ff; }
.rarity-border-epic { border-color: #b968ff; }
.rarity-border-legendary { border-color: #ffb23e; box-shadow: 0 0 14px rgba(255,178,62,0.3); }
.rarity-border-mythic { border-color: #ff5ec8; box-shadow: 0 0 16px rgba(255,94,200,0.4); }
.item-preview { width: 100%; height: 64px; border-radius: 10px; margin-bottom: 8px; }
.item-name { font-weight: 800; font-size: 13px; }
.item-rarity { font-size: 9px; font-weight: 800; letter-spacing: 1px; margin: 2px 0 6px; }
.rarity-common { color: #9aa5b1; } .rarity-uncommon { color: #5fd97a; } .rarity-rare { color: #4fa8ff; }
.rarity-epic { color: #b968ff; } .rarity-legendary { color: #ffb23e; } .rarity-mythic { color: #ff5ec8; }
.item-desc { font-size: 10px; color: var(--text-dim); min-height: 14px; margin-bottom: 6px; }
.item-btn { width: 100%; padding: 8px 4px; border-radius: 10px; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
.buy-btn { background: linear-gradient(135deg, var(--cyan), var(--accent)); color: #fff; }
.buy-btn:active { transform: scale(0.95); }
.owned-btn { background: rgba(125,255,90,0.18); color: var(--green); border: 1px solid rgba(125,255,90,0.4); }
.locked-btn { background: rgba(255,255,255,0.05); color: var(--text-dim); }
.coin-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }

/* ---------- Missions / achievements ---------- */
.list-col { display: flex; flex-direction: column; gap: 10px; padding: 0 12px 20px; }
.mission-row { display: flex; gap: 10px; background: var(--panel); border-radius: var(--radius-sm); padding: 12px; align-items: center; }
.mission-info { flex: 1; }
.mission-name { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.mission-desc { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.progress-bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); transition: width 0.3s; }
.progress-label { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
.mission-reward { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
.reward-chip { font-size: 11px; font-weight: 800; color: var(--gold); background: rgba(255,206,69,0.12); padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
.claim-btn, .claim-mission-btn { padding: 6px 12px; font-size: 10px; }
.claimed-tag { font-size: 10px; color: var(--text-dim); font-weight: 700; }

/* ---------- Collection: chests / stats ---------- */
.chest-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px 20px; }
.chest-card { background: var(--panel); border-radius: var(--radius); padding: 16px; text-align: center; border: 2px solid rgba(255,255,255,0.06); }
.chest-icon { font-size: 34px; margin-bottom: 6px; }
.stats-grid { padding: 0 12px 20px; display: flex; flex-direction: column; gap: 8px; }
.stat-row { display: flex; justify-content: space-between; background: var(--panel); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; }
.stat-row-val { font-weight: 800; color: var(--cyan); }

/* ---------- Leaderboard ---------- */
.friend-code-box { margin: 0 12px 16px; background: var(--panel); border-radius: var(--radius); padding: 14px; text-align: center; }
.friend-code-label { font-size: 10px; letter-spacing: 1px; color: var(--text-dim); }
.friend-code-value { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: var(--cyan); margin: 4px 0 10px; }
.friend-add-row { display: flex; gap: 8px; }
.friend-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: #fff; font-weight: 700; text-align: center; letter-spacing: 1px; }
.small-btn { padding: 0 16px; font-size: 12px; }
.podium-row { display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 6px 16px 18px; }
.podium-item { background: var(--panel); border-radius: var(--radius-sm); padding: 10px; text-align: center; width: 90px; }
.podium-item.rank-1 { padding-bottom: 18px; border: 1px solid rgba(255,178,62,0.5); }
.podium-item.rank-2 { border: 1px solid rgba(154,165,177,0.5); }
.podium-item.rank-3 { border: 1px solid rgba(255,138,62,0.4); }
.podium-avatar { width: 32px; height: 32px; border-radius: 50%; margin: 4px auto; background: linear-gradient(135deg, var(--cyan), var(--accent)); }
.podium-rank { font-weight: 900; font-size: 13px; color: var(--gold); }
.podium-name { font-size: 11px; font-weight: 700; }
.podium-score { font-size: 12px; font-weight: 800; color: var(--cyan); }
.lb-list { padding: 0 12px 20px; display: flex; flex-direction: column; gap: 6px; }
.lb-row { display: flex; align-items: center; gap: 10px; background: var(--panel); padding: 10px 12px; border-radius: var(--radius-sm); }
.lb-row.is-player { border: 1px solid var(--cyan); background: rgba(0,229,255,0.08); }
.lb-rank { width: 36px; font-weight: 800; color: var(--text-dim); font-size: 12px; }
.lb-name { flex: 1; font-weight: 700; font-size: 13px; }
.lb-score { font-weight: 800; color: var(--gold); font-size: 13px; }
.lb-divider { text-align: center; color: var(--text-dim); }
.challenge-btn { background: rgba(255,59,214,0.15); color: var(--accent2); border: 1px solid rgba(255,59,214,0.4); border-radius: 8px; padding: 5px 10px; font-size: 10px; font-weight: 800; }
.empty-state { text-align: center; color: var(--text-dim); padding: 30px; font-size: 13px; }
.challenge-type-row { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.challenge-vs-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 14px 0; }
.challenge-side { text-align: center; }
.challenge-name { font-size: 12px; color: var(--text-dim); font-weight: 700; }
.challenge-value { font-size: 20px; font-weight: 900; color: var(--cyan); }
.challenge-vs { font-weight: 900; color: var(--text-dim); }

/* ---------- Settings ---------- */
.settings-list { padding: 0 14px 30px; display: flex; flex-direction: column; gap: 10px; }
.settings-row { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; font-weight: 700; }
.settings-row.col { flex-direction: column; align-items: stretch; gap: 8px; }
.settings-section-title { font-size: 11px; letter-spacing: 2px; color: var(--text-dim); margin: 10px 0 -2px; padding-left: 4px; }
.volume-slider { width: 55%; accent-color: var(--cyan); }
.segment-group { display: flex; gap: 6px; }
.segment-btn { flex: 1; padding: 8px 4px; border-radius: 8px; background: rgba(255,255,255,0.06); font-size: 11px; font-weight: 700; color: var(--text-dim); }
.segment-btn.active { background: linear-gradient(135deg, var(--accent), var(--cyan)); color: #fff; }
.toggle-switch { width: 44px; height: 24px; border-radius: 999px; background: rgba(255,255,255,0.12); position: relative; transition: background 0.2s; }
.toggle-switch.on { background: linear-gradient(90deg, var(--green), var(--cyan)); }
.toggle-knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left 0.2s; }
.toggle-switch.on .toggle-knob { left: 23px; }
.danger-btn { background: linear-gradient(135deg, #ff3860, #ff6a45); color: #fff; margin-top: 6px; }

/* ---------- Tutorial ---------- */
.tutorial-screen { display: flex; align-items: center; justify-content: center; }
.tutorial-card { text-align: center; padding: 30px; max-width: 320px; }
.tutorial-progress { font-size: 11px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 20px; }
.tutorial-icon { font-size: 48px; margin-bottom: 16px; filter: drop-shadow(0 0 12px rgba(124,77,255,0.6)); }
.tutorial-title { font-size: 24px; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; }
.tutorial-desc { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.5; }
.skip-link { display: block; margin-top: 14px; font-size: 12px; color: var(--text-dim); text-decoration: underline; }

/* ---------- Generic menu buttons / modal ---------- */
.menu-btn {
  display: block; width: 100%; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 800; letter-spacing: 1px;
  background: linear-gradient(135deg, var(--cyan), var(--accent)); color: #fff; margin-bottom: 10px;
}
.menu-btn:active { transform: scale(0.97); }
.menu-btn.secondary { background: rgba(255,255,255,0.08); }
.btn-row { display: flex; gap: 10px; }
.btn-row .menu-btn { flex: 1; }

#modalLayer { position: fixed; inset: 0; z-index: 80; pointer-events: none; }
#modalLayer.active { pointer-events: auto; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(2,4,10,0.7); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.22s; backdrop-filter: blur(4px); }
.modal-backdrop.show { opacity: 1; }
.modal-card {
  background: var(--panel-light); border-radius: 22px; padding: 26px 24px; width: min(340px, 88vw); text-align: center;
  border: 1px solid rgba(255,255,255,0.1); transform: scale(0.85) translateY(10px); transition: transform 0.25s ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal-backdrop.show .modal-card { transform: scale(1) translateY(0); }
.levelup-title { font-size: 24px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(90deg, var(--gold), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 6px; }
.levelup-level { font-size: 34px; font-weight: 900; margin: 10px 0; }
.levelup-unlock { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; min-height: 18px; }
.levelup-burst { width: 80px; height: 80px; margin: 0 auto 10px; border-radius: 50%; background: radial-gradient(circle, rgba(255,206,69,0.6), transparent 70%); animation: burstPulse 1.2s ease-in-out infinite; }
@keyframes burstPulse { 0%,100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.15); opacity: 1; } }
.chest-open-icon { font-size: 60px; margin-bottom: 6px; animation: chestShake 0.5s ease-in-out; }
@keyframes chestShake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.chest-rewards { margin: 14px 0 20px; }
.chest-reward-line { font-size: 15px; font-weight: 800; color: var(--gold); margin: 4px 0; }
.daily-strip { display: flex; gap: 5px; margin: 14px 0; overflow-x: auto; }
.daily-cell { flex-shrink: 0; width: 44px; padding: 6px 2px; border-radius: 10px; background: rgba(255,255,255,0.05); text-align: center; }
.daily-cell.active { background: linear-gradient(135deg, var(--gold), var(--accent2)); }
.daily-cell.done { opacity: 0.4; }
.daily-day { font-size: 8px; font-weight: 700; }
.daily-icon { font-size: 16px; margin-top: 2px; }
.daily-claim-label { font-size: 14px; font-weight: 800; margin-bottom: 16px; color: var(--gold); }

/* ---------- Toasts / confetti ---------- */
#toastLayer { position: fixed; top: calc(70px + var(--safe-top)); left: 0; right: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--panel-light); border: 1px solid; border-radius: 12px; padding: 10px 18px; font-size: 13px; font-weight: 700; opacity: 0; transform: translateY(-12px); transition: opacity 0.25s, transform 0.25s; }
.toast.show { opacity: 1; transform: translateY(0); }
.confetti-piece { position: fixed; top: 20%; width: 8px; height: 14px; opacity: 0.9; animation: confettiFall 2s ease-in forwards; z-index: 95; }
@keyframes confettiFall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(70vh) rotate(400deg); opacity: 0; } }

/* ---------- Gameplay screen ---------- */
.game-screen { padding: 0 !important; }
#gameCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
.hud-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 14; }
.hud-top { display: flex; align-items: center; gap: 12px; padding: calc(12px + var(--safe-top)) 16px 0; }
.hud-pause { width: 38px; height: 38px; background: rgba(10,14,24,0.55); border-radius: 50%; font-size: 13px; backdrop-filter: blur(6px); }
.hud-hp { display: flex; gap: 4px; }
.hp-pip { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }
.hp-pip.full { background: var(--red); box-shadow: 0 0 8px var(--red); border-color: transparent; }
.hp-pip.empty { background: rgba(255,255,255,0.05); }
.hud-score-wrap { margin-left: auto; text-align: right; }
.hud-score { font-size: 26px; font-weight: 900; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
.hud-score-label { font-size: 9px; letter-spacing: 2px; color: var(--text-dim); }
.hud-combo {
  position: absolute; top: 70px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 900;
  color: var(--gold); text-shadow: 0 0 12px rgba(255,206,69,0.7); opacity: 0; transition: opacity 0.15s;
}
.hud-banner {
  position: absolute; top: 100px; left: 50%; transform: translateX(-50%) translateY(-10px); font-size: 20px; font-weight: 900;
  letter-spacing: 3px; padding: 8px 22px; border-radius: 999px; background: rgba(10,14,24,0.7); color: #fff; opacity: 0;
}
.hud-banner.show { animation: bannerPop 2.2s ease forwards; }
@keyframes bannerPop { 0% { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.9); } 15% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.05); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-6px); } }
.hud-status-icons { position: absolute; top: 60px; right: 16px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.status-icon { font-size: 10px; font-weight: 800; background: rgba(10,14,24,0.6); padding: 3px 8px; border-radius: 8px; letter-spacing: 1px; }

/* ---------- Controls layer ----------
   NOTE: .game-screen is only truly hidden via opacity/pointer-events:none on
   itself, but that does NOT cascade onto descendants that set their own
   pointer-events. The joystick/buttons/swipe-zone need pointer-events:auto
   to work, so they must be re-scoped to fire only while .game-screen is
   .active, or they'd sit invisibly on top of every other screen and eat
   clicks (caught by smoke-testing: the Play button became unclickable). */
.controls-layer { position: absolute; inset: 0; z-index: 12; }
.joy-base, .swipe-zone, .action-btn, .hud-pause { pointer-events: none; }
.game-screen.active .joy-base,
.game-screen.active .swipe-zone,
.game-screen.active .action-btn,
.game-screen.active .hud-pause { pointer-events: auto; }
.joy-base {
  position: absolute; left: 26px; bottom: calc(30px + var(--safe-bottom)); width: 110px; height: 110px; border-radius: 50%;
  background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15);
}
.joy-base.right-side { left: auto; right: 26px; }
.joy-knob { position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(0,229,255,0.35); border: 2px solid rgba(0,229,255,0.7); transition: transform 0.06s linear; }
.swipe-zone { position: absolute; inset: 0; z-index: -1; }
.action-cluster { position: absolute; right: 22px; bottom: calc(26px + var(--safe-bottom)); display: flex; align-items: flex-end; gap: 10px; }
.action-cluster.left-side { right: auto; left: 22px; flex-direction: row-reverse; }
.action-btn {
  border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; color: #fff; position: relative; overflow: hidden;
}
.action-btn.pressed { transform: scale(0.88); background: rgba(255,255,255,0.22); }
.dash-btn { width: 70px; height: 70px; font-size: 26px; border-color: rgba(0,229,255,0.6); background: rgba(0,229,255,0.12); }
.jump-btn { width: 56px; height: 56px; font-size: 20px; margin-bottom: 24px; border-color: rgba(125,255,90,0.6); background: rgba(125,255,90,0.1); }
.ability-btn { width: 60px; height: 60px; font-size: 22px; margin-bottom: 6px; border-color: rgba(255,59,214,0.6); background: rgba(255,59,214,0.12); }
.btn-cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: rgba(0,0,0,0.55); transition: height 0.1s linear; }
.btn-icon { position: relative; z-index: 1; }

/* ---------- Pause menu ---------- */
.pause-menu { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(2,4,10,0.7); backdrop-filter: blur(4px); }
.pause-menu.active { display: flex; }
.pause-card { background: var(--panel-light); border-radius: 22px; padding: 26px; width: min(300px, 82vw); text-align: center; }
.pause-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; margin-bottom: 18px; }

/* ---------- Game over ---------- */
.gameover-screen { display: flex; align-items: center; justify-content: center; }
.gameover-card { text-align: center; padding: 24px; max-width: 360px; width: 90vw; }
.gameover-title { font-size: 26px; font-weight: 900; letter-spacing: 3px; color: var(--text-dim); margin-bottom: 10px; }
.new-record-badge {
  display: inline-block; font-size: 16px; font-weight: 900; letter-spacing: 2px; padding: 8px 18px; border-radius: 999px;
  background: linear-gradient(135deg, var(--gold), var(--accent2)); margin-bottom: 10px; animation: recordPulse 1s ease-in-out infinite;
}
@keyframes recordPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.best-line { font-size: 12px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 20px; }

.stat-label { font-size: 9px; letter-spacing: 1px; color: var(--text-dim); margin-top: 2px; }

@keyframes spin { to { transform: rotate(360deg); } }

/* RUSHVERSE - Data/SaveSystem.js
   Local persistence layer. Everything the game needs to remember lives here,
   wrapped so the rest of the codebase never touches localStorage directly.
   Designed so a future networked backend can slot in behind the same API
   (see RV.Save.setRemoteAdapter). */
(function (RV) {
  'use strict';

  var STORAGE_KEY = 'rushverse_save_v1';
  var SAVE_VERSION = 1;

  function uid(prefix) {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var s = '';
    for (var i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return prefix + '-' + s;
  }

  function defaultSave() {
    return {
      version: SAVE_VERSION,
      playerName: 'Runner',
      playerCode: uid('RV'),
      createdAt: Date.now(),

      coins: 250,
      gems: 15,
      level: 1,
      xp: 0,

      bestScore: 0,
      lifetimeCoins: 0,
      gamesPlayed: 0,
      totalSurvivalMs: 0,
      totalPlayMs: 0,
      bestCombo: 0,
      bestSurvivalMs: 0,
      damagelessWins: 0,
      abilityUses: 0,

      characters: {
        owned: ['rush'],
        equipped: 'rush'
      },
      skins: {
        owned: ['outfit_default', 'trail_default', 'effect_default', 'emote_default'],
        equipped: {
          outfit: 'outfit_default',
          trail: 'trail_default',
          effect: 'effect_default',
          emote: 'emote_default'
        }
      },
      maps: {
        unlocked: ['neon_city']
      },

      achievements: {},
      missions: {
        daily: null,
        weekly: null,
        dailyResetAt: 0,
        weeklyResetAt: 0
      },

      dailyReward: {
        streak: 0,
        lastClaim: 0
      },

      chests: { common: 0, rare: 0, epic: 0, legendary: 0 },
      keys: { common: 0, rare: 0, epic: 0, legendary: 0 },

      friends: [],

      settings: {
        musicVolume: 0.6,
        sfxVolume: 0.8,
        graphics: 'medium',
        vibration: true,
        language: 'en',
        joystickSide: 'left'
      },

      tutorialDone: false,
      lastRun: null
    };
  }

  function deepMerge(base, incoming) {
    if (typeof incoming !== 'object' || incoming === null) return base;
    Object.keys(base).forEach(function (k) {
      if (incoming[k] === undefined) return;
      if (typeof base[k] === 'object' && base[k] !== null && !Array.isArray(base[k])) {
        base[k] = deepMerge(base[k], incoming[k]);
      } else {
        base[k] = incoming[k];
      }
    });
    return base;
  }

  var state = null;
  var remoteAdapter = null;
  var dirty = false;

  function load() {
    var fresh = defaultSave();
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state = deepMerge(fresh, parsed);
      } else {
        state = fresh;
      }
    } catch (e) {
      console.warn('[RUSHVERSE] save load failed, starting fresh', e);
      state = fresh;
    }
    return state;
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      dirty = false;
      if (remoteAdapter && remoteAdapter.push) remoteAdapter.push(state);
    } catch (e) {
      console.warn('[RUSHVERSE] save persist failed', e);
    }
  }

  var persistTimer = null;
  function scheduleSave() {
    dirty = true;
    if (persistTimer) return;
    persistTimer = setTimeout(function () {
      persistTimer = null;
      if (dirty) persist();
    }, 250);
  }

  window.addEventListener('beforeunload', function () {
    if (dirty) persist();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && dirty) persist();
  });

  RV.Save = {
    get: function () { return state || load(); },
    save: scheduleSave,
    saveNow: persist,
    reset: function () {
      state = defaultSave();
      persist();
      return state;
    },
    setRemoteAdapter: function (adapter) { remoteAdapter = adapter; },
    uid: uid
  };

   by GameLoop (which reads state.active). Keeps every run feeling different. */

  'use strict';

  var DEFS = {
    coinRain: { label: 'COIN RAIN', duration: 6, color: '#ffce45' },
    speedMode: { label: 'SPEED MODE', duration: 8, color: '#ff6a6a' },
    blackout: { label: 'BLACKOUT', duration: 5, color: '#7d8fff' },
    giantEnemy: { label: 'GIANT ENEMY', duration: 0, color: '#ff2f5f' },

    var shakeOff = RV.Effects.getShakeOffset();
    ctx.save();
    ctx.translate(shakeOff.x, shakeOff.y);

    RV.Maps.render(ctx, { width: w, height: h }, match.map, ARENA_RADIUS, project, match.events.active === 'blackout');

    var drawables = [];
    match.obstacles.forEach(function (o) { drawables.push({ z: o.z, fn: function () { RV.Obstacles.draw(ctx, o, project); } }); });
    match.pickups.forEach(function (item) { drawables.push({ z: item.z, fn: function () { RV.Pickups.draw(ctx, item, project); } }); });
    match.enemies.forEach(function (e) { drawables.push({ z: e.z, fn: function () { RV.Enemy.draw(ctx, e, project); } }); });
    match.projectiles.forEach(function (pr) { drawables.push({ z: pr.z, fn: function () {
      var pos = project(pr.x, pr.z);
      if (!pos || pos.cull) return;
      ctx.fillStyle = '#ffdd66'; ctx.shadowColor = '#ffdd66'; ctx.shadowBlur = 8 * pos.scale;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, 5 * pos.scale, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    } }); });
    drawables.push({ z: match.player.z, fn: function () { RV.Player.draw(ctx, match.player, project, match.skin); } });
    drawables.sort(function (a, b) { return a.z - b.z; });
    drawables.forEach(function (d) { d.fn(); });

    RV.Effects.drawWorldParticles(ctx, project);
    RV.Effects.drawScreenFloaters(ctx, project);

    ctx.restore();
  }

  function getHudState() {
    var p = match.player;

      score: Math.round(match.displayScore),
      combo: match.combo.count,

      abilityReady: p.abilityCooldown <= 0,
      abilityPct: 1 - p.abilityCooldown / (p.character.ability.cooldown / 1000),

      shieldActive: p.status.shieldTimer > 0,

      magnetActive: p.status.magnetTimer > 0,
      multiplierActive: p.status.multiplierTimer > 0

  }

  function endMatch() {
    if (match.ended) return;
    match.ended = true;
    stop();
    var save = RV.Save.get();
    var survivalMs = match.elapsed * 1000;
    var isNewBest = match.score > save.bestScore;

    save.gamesPlayed += 1;
    save.bestScore = Math.max(save.bestScore, Math.round(match.score));
    save.bestCombo = Math.max(save.bestCombo, match.combo.best);
    save.bestSurvivalMs = Math.max(save.bestSurvivalMs, survivalMs);
    save.totalSurvivalMs += survivalMs;
    save.abilityUses += match.abilityUses;
    if (!match.player.tookDamageThisRun) save.damagelessWins += 1;
    RV.Save.save();

    RV.Progress.updateMissionStat('matchesThisPeriod', 1, 'add');
    RV.Progress.updateMissionStat('scoreSumThisPeriod', Math.round(match.score), 'add');
    RV.Progress.checkAchievements();
    RV.Progress.checkCharacterUnlocks();
    RV.Progress.checkMapUnlocks();

    var xpEarned = Math.round(match.score / 12 + match.elapsed * 2 + match.coinsCollected * 0.3);
    var levelUps = RV.Progress.addXP(xpEarned);

    if (isNewBest) RV.Audio.sfx.highScore(); else RV.Audio.sfx.gameOver();

    fire('gameover', {
      score: Math.round(match.score),
      bestScore: save.bestScore,
      isNewBest: isNewBest,
      coins: match.coinsCollected,
      gems: match.gemsCollected,

    on: on, ARENA_RADIUS: ARENA_RADIUS,

/* ==== js/UI/UIManager.js ==== */
/* RUSHVERSE - UI/UIManager.js
   Screen router + shared chrome (currency/level header), toast/modal
   helpers, and small format utilities every screen module reuses. */
(function (RV) {
  'use strict';

  var screens = {};
  var current = null;
  var root, headerEl;

  function registerScreen(name, api) { screens[name] = api; }

  function init(rootEl) {
    root = rootEl;
    headerEl = document.getElementById('topHeader');
    renderHeader();
    RV.Progress.on('levelup', renderHeader);
  }

  function show(name, opts) {
    Object.keys(screens).forEach(function (key) {
      var el = screens[key].el;
      if (!el) return;
      el.classList.toggle('active', key === name);
    });
    if (screens[name] && screens[name].onShow) screens[name].onShow(opts);
    current = name;
    var isGameplay = (name === 'game');
    headerEl.classList.toggle('hidden', isGameplay || name === 'tutorial');
    document.getElementById('bottomNav').classList.toggle('hidden', isGameplay || name === 'tutorial');
    if (!isGameplay) renderHeader();
  }

  function getCurrent() { return current; }

  function renderHeader() {
    var s = RV.Save.get();
    var prog = RV.Progress.xpProgress();
    headerEl.innerHTML =
      '<div class="curr-pill coin-pill"><span class="curr-icon">&#9679;</span>' + fmt(s.coins) + '</div>' +
      '<div class="curr-pill gem-pill"><span class="curr-icon">&#9670;</span>' + fmt(s.gems) + '</div>' +
      '<div class="level-block">' +
        '<div class="level-badge">LV ' + prog.level + '</div>' +
        '<div class="xp-bar"><div class="xp-fill" style="width:' + Math.round(prog.pct * 100) + '%"></div></div>' +
      '</div>';
  }

  function fmt(n) {
    n = Math.round(n);
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 10000) return Math.round(n / 1000) + 'K';
    if (n >= 1000) return n.toLocaleString();
    return String(n);
  }

  function fmtTime(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function rarityColor(r) { return RV.Data.RARITY_COLOR[r] || '#9aa5b1'; }

  var toastQueue = [];
  var toastShowing = false;
  function toast(text, color) {
    toastQueue.push({ text: text, color: color || '#fff' });
    if (!toastShowing) showNextToast();
  }
  function showNextToast() {
    var t = toastQueue.shift();
    if (!t) { toastShowing = false; return; }
    toastShowing = true;
    var el = document.getElementById('toastLayer');
    var node = document.createElement('div');
    node.className = 'toast';
    node.style.borderColor = t.color;
    node.textContent = t.text;
    el.appendChild(node);
    requestAnimationFrame(function () { node.classList.add('show'); });
    setTimeout(function () {
      node.classList.remove('show');
      setTimeout(function () { node.remove(); showNextToast(); }, 250);
    }, 1900);
  }

  function modal(innerHtml, opts) {
    opts = opts || {};
    var layer = document.getElementById('modalLayer');
    layer.innerHTML = '<div class="modal-backdrop"><div class="modal-card">' + innerHtml + '</div></div>';
    layer.classList.add('active');
    var backdrop = layer.querySelector('.modal-backdrop');
    requestAnimationFrame(function () { backdrop.classList.add('show'); });
    if (opts.dismissible !== false) {
      backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeModal(); });
    }
    return layer.querySelector('.modal-card');
  }
  function closeModal() {
    var layer = document.getElementById('modalLayer');
    var backdrop = layer.querySelector('.modal-backdrop');
    if (!backdrop) return;
    backdrop.classList.remove('show');
    setTimeout(function () { layer.classList.remove('active'); layer.innerHTML = ''; }, 220);
  }

  RV.UI = {
    registerScreen: registerScreen, init: init, show: show, getCurrent: getCurrent,
    renderHeader: renderHeader, fmt: fmt, fmtTime: fmtTime, rarityColor: rarityColor,
    toast: toast, modal: modal, closeModal: closeModal
  };
})(window.RV || (window.RV = {}));

/* RUSHVERSE - UI/HomeScreen.js
   Title screen: character + map picker (quick-swap arrows, no heavy menu)
   and the PLAY button, so a run starts in seconds. */
(function (RV) {
  'use strict';

  var el;
  var charIndex = 0, mapIndex = 0;

  function ownedCharacters() {
    var s = RV.Save.get();
    return RV.Data.CHARACTERS.filter(function (c) { return s.characters.owned.indexOf(c.id) !== -1; });
  }
  function unlockedMaps() {
    var s = RV.Save.get();
    return RV.Data.MAPS.filter(function (m) { return s.maps.unlocked.indexOf(m.id) !== -1; });
  }

  function build(container) {
    el = document.createElement('div');
    el.className = 'screen home-screen';
    el.innerHTML =
      '<div class="home-glow"></div>' +
      '<div class="logo-wrap">' +
        '<div class="logo-title">RUSH<span class="logo-accent">VERSE</span></div>' +
        '<div class="logo-sub">ARENA ACTION</div>' +
      '</div>' +
      '<div class="picker-row" id="charPicker">' +
        '<button class="picker-arrow" data-dir="-1" data-target="char">&#10094;</button>' +
        '<div class="picker-card" id="charCard"></div>' +
        '<button class="picker-arrow" data-dir="1" data-target="char">&#10095;</button>' +
      '</div>' +
      '<div class="picker-row map-row" id="mapPicker">' +
        '<button class="picker-arrow" data-dir="-1" data-target="map">&#10094;</button>' +
        '<div class="picker-card map-card" id="mapCard"></div>' +
        '<button class="picker-arrow" data-dir="1" data-target="map">&#10095;</button>' +
      '</div>' +
      '<button class="play-btn" id="playBtn"><span>PLAY</span></button>' +
      '<div class="best-score-line" id="bestScoreLine"></div>';
    container.appendChild(el);

    el.querySelectorAll('.picker-arrow').forEach(function (btn) {
      btn.addEventListener('click', function () {
        RV.Audio.resume(); RV.Audio.sfx.click();
        var dir = parseInt(btn.dataset.dir, 10);
        if (btn.dataset.target === 'char') {
          var chars = ownedCharacters();
          charIndex = (charIndex + dir + chars.length) % chars.length;
          equipCharacter(chars[charIndex].id);
        } else {
          var maps = unlockedMaps();
          mapIndex = (mapIndex + dir + maps.length) % maps.length;
        }
        renderCards();
      });
    });

    el.querySelector('#playBtn').addEventListener('click', function () {
      RV.Audio.resume(); RV.Audio.sfx.click();
      var s = RV.Save.get();
      var maps = unlockedMaps();
      var map = maps[mapIndex] || maps[0];
      if (!s.tutorialDone) {
        RV.UI.show('tutorial', { onDone: function () { launchMatch(s.characters.equipped, map.id); } });
      } else {
        launchMatch(s.characters.equipped, map.id);
      }
    });

    return { el: el, onShow: onShow };
  }

  function equipCharacter(id) {
    var s = RV.Save.get();
    s.characters.equipped = id;
    RV.Save.save();
  }

  function launchMatch(characterId, mapId) {
    var s = RV.Save.get();
    var skin = {
      outfitColor: (RV.Data.getShopItem(s.skins.equipped.outfit) || {}).color
    };
    RV.UI.show('game');
    RV.HUD.startMatch(characterId, mapId, skin);
  }

  function renderCards() {
    var chars = ownedCharacters();
    var maps = unlockedMaps();
    var s = RV.Save.get();
    var equippedIdx = chars.findIndex(function (c) { return c.id === s.characters.equipped; });
    if (equippedIdx !== -1) charIndex = equippedIdx;
    var c = chars[charIndex] || chars[0];
    var m = maps[mapIndex] || maps[0];

    document.getElementById('charCard').innerHTML =
      '<div class="char-avatar" style="background:radial-gradient(circle at 35% 30%,' + c.accent + ',' + c.color + ')"></div>' +
      '<div class="picker-name">' + c.name + '</div>' +
      '<div class="picker-sub rarity-' + c.rarity + '">' + c.rarity.toUpperCase() + '</div>' +
      '<div class="picker-desc">' + c.ability.name + ' — ' + c.ability.desc + '</div>';

    document.getElementById('mapCard').innerHTML =
      '<div class="map-avatar" style="background:linear-gradient(160deg,' + m.palette.sky2 + ',' + m.palette.floor1 + ')">' +
        '<div class="map-avatar-glow" style="background:' + m.palette.glow + '"></div>' +
      '</div>' +
      '<div class="picker-name">' + m.name + '</div>' +
      '<div class="picker-desc">' + m.desc + '</div>';

    document.getElementById('bestScoreLine').textContent = 'BEST SCORE  ' + RV.UI.fmt(s.bestScore);
  }

  function onShow() {
    renderCards();
  }

  RV.HomeScreen = { build: build };
})(window.RV || (window.RV = {}));

/* RUSHVERSE - UI/HUD.js
   Builds the gameplay screen (canvas + touch controls + live HUD overlay),
   drives GameLoop start/stop, and reacts to its callbacks (hud tick, combo
   milestones, event banners, game over). */
(function (RV) {
  'use strict';

  var el, canvas, hudOverlay, controlsLayer;
  var paused = false;

  function build(container) {
    el = document.createElement('div');
    el.className = 'screen game-screen';
    el.innerHTML =
      '<canvas id="gameCanvas"></canvas>' +
      '<div id="hudOverlay" class="hud-overlay">' +
        '<div class="hud-top">' +
          '<button id="pauseBtn" class="hud-pause">&#10073;&#10073;</button>' +
          '<div class="hud-hp" id="hudHp"></div>' +
          '<div class="hud-score-wrap"><div class="hud-score" id="hudScore">0</div><div class="hud-score-label">SCORE</div></div>' +
        '</div>' +
        '<div class="hud-combo" id="hudCombo"></div>' +
        '<div class="hud-banner" id="hudBanner"></div>' +
        '<div class="hud-status-icons" id="hudStatusIcons"></div>' +
      '</div>' +
      '<div id="controlsLayer" class="controls-layer"></div>' +
      '<div id="pauseMenu" class="pause-menu"></div>';
    container.appendChild(el);

    canvas = el.querySelector('#gameCanvas');
    hudOverlay = el.querySelector('#hudOverlay');
    controlsLayer = el.querySelector('#controlsLayer');

    RV.GameLoop.init(canvas);
    RV.Controls.build(controlsLayer);

    el.querySelector('#pauseBtn').addEventListener('click', togglePause);

    RV.GameLoop.on('hud', updateHud);
    RV.GameLoop.on('eventBanner', showBanner);
    RV.GameLoop.on('gameover', onGameOver);

    return { el: el };
  }

  function startMatch(characterId, mapId, skin) {
    paused = false;
    el.querySelector('#pauseMenu').classList.remove('active');
    RV.GameLoop.start({ characterId: characterId, mapId: mapId, skin: skin });
  }

  function togglePause() {
    paused = !paused;
    if (paused) { RV.GameLoop.pause(); renderPauseMenu(); }
    else { RV.GameLoop.resume(); el.querySelector('#pauseMenu').classList.remove('active'); }
    RV.Audio.sfx.click();
  }

  function renderPauseMenu() {
    var m = el.querySelector('#pauseMenu');
    m.classList.add('active');
    m.innerHTML =
      '<div class="pause-card">' +
        '<div class="pause-title">PAUSED</div>' +
        '<button class="menu-btn" id="resumeBtn">RESUME</button>' +
        '<button class="menu-btn" id="restartBtn">RESTART</button>' +
        '<button class="menu-btn secondary" id="homeBtn">HOME</button>' +
      '</div>';
    m.querySelector('#resumeBtn').addEventListener('click', togglePause);
    m.querySelector('#restartBtn').addEventListener('click', function () {
      var match = RV.GameLoop.getMatch();
      togglePause();
      startMatch(match.character.id, match.map.id, match.skin);
    });
    m.querySelector('#homeBtn').addEventListener('click', function () {
      RV.GameLoop.stop();
      RV.UI.show('home');
    });
  }

  function updateHud(state) {
    var hpEl = document.getElementById('hudHp');
    var pips = '';
    for (var i = 0; i < state.maxHp; i++) pips += '<span class="hp-pip ' + (i < state.hp ? 'full' : 'empty') + '"></span>';
    hpEl.innerHTML = pips;

    document.getElementById('hudScore').textContent = RV.UI.fmt(state.score);

    var comboEl = document.getElementById('hudCombo');
    if (state.combo >= 2) {
      comboEl.style.opacity = 1;
      comboEl.textContent = 'COMBO x' + state.combo;

      comboEl.style.opacity = 0;
    }

    var icons = [];
    if (state.shieldActive) icons.push('<span class="status-icon" style="color:#7ad9ff">SHIELD</span>');
    if (state.speedActive) icons.push('<span class="status-icon" style="color:#7dff5a">SPEED</span>');
    if (state.magnetActive) icons.push('<span class="status-icon" style="color:#ff7ad1">MAGNET</span>');
    if (state.multiplierActive) icons.push('<span class="status-icon" style="color:#ffce45">x2 SCORE</span>');
    document.getElementById('hudStatusIcons').innerHTML = icons.join('');
  }

  function showBanner(text) {
    var banner = document.getElementById('hudBanner');
    banner.textContent = text;
    banner.classList.remove('show');
    void banner.offsetWidth;
    banner.classList.add('show');
  }

  function onGameOver(result) {
    RV.UI.show('gameover', result);
  }

  RV.HUD = { build: build, startMatch: startMatch };

    var oppVal = cr.type === 'score' ? RV.UI.fmt(cr.opponentValue) : RV.UI.fmtTime(cr.opponentValue);
    var card = RV.UI.modal(
      '<div class="levelup-title" style="color:' + (cr.won ? '#7dff5a' : '#ff6a6a') + '">' + (cr.won ? 'CHALLENGE WON!' : 'CHALLENGE LOST') + '</div>' +

   USE ABILITY, SURVIVE), then straight into the player's first match. */
(function (RV) {
  'use strict';

  var el, onDone, step;
  var STEPS = [
    { title: 'MOVE', desc: 'Drag the left stick to run around the arena.', icon: '&#8598;' },
    { title: 'DASH', desc: 'Tap DASH (or swipe) to burst through danger.', icon: '&#187;' },
    { title: 'COLLECT', desc: 'Grab coins and gems to level up faster.', icon: '&#9679;' },
    { title: 'USE ABILITY', desc: 'Tap the Ability button for your character\'s power.', icon: '&#9889;' },
    { title: 'SURVIVE', desc: 'The longer you last, the higher your score.', icon: '&#9733;' }
  ];

    render();
  }

    var s = STEPS[step];
    el.innerHTML =
      '<div class="tutorial-card">' +

/* ==== js/Missions/DailyReward.js ==== */
/* RUSHVERSE - Missions/DailyReward.js
   7-day login streak. Checked once on boot; shows a modal if today's
   reward hasn't been claimed yet. Missing a day resets the streak to 1
   (still lets them claim), it never blocks play. */
(function (RV) {
  'use strict';

  var DAY_MS = 86400000;

  function checkAndMaybeShow() {
    var s = RV.Save.get();
    var today = Math.floor(Date.now() / DAY_MS);
    var lastDay = Math.floor((s.dailyReward.lastClaim || 0) / DAY_MS);
    if (lastDay === today) return; // already claimed today

    var streak = s.dailyReward.streak || 0;
    var isConsecutive = lastDay === today - 1;
    var newStreak = isConsecutive ? streak + 1 : 1;
    if (newStreak > 7) newStreak = 1;
    show(newStreak);
  }

  function show(dayNumber) {
    var def = RV.Data.DAILY_REWARDS[dayNumber - 1];
    var label = rewardLabel(def);
    var row = RV.Data.DAILY_REWARDS.map(function (d) {
      var cls = d.day === dayNumber ? 'daily-cell active' : d.day < dayNumber ? 'daily-cell done' : 'daily-cell';
      return '<div class="' + cls + '"><div class="daily-day">DAY ' + d.day + '</div><div class="daily-icon">' + dailyIcon(d) + '</div></div>';
    }).join('');

    var card = RV.UI.modal(
      '<div class="levelup-title">DAILY REWARD</div>' +
      '<div class="daily-strip">' + row + '</div>' +
      '<div class="daily-claim-label">' + label + '</div>' +
      '<button class="menu-btn" id="dailyClaimBtn">CLAIM</button>',
      { dismissible: false }
    );
    card.querySelector('#dailyClaimBtn').addEventListener('click', function () {
      RV.Audio.resume(); RV.Audio.sfx.achievement();
      claim(dayNumber, def);
      RV.UI.closeModal();
    });
  }

  function dailyIcon(d) {
    if (d.type === 'coins') return '&#9679;';
    if (d.type === 'gems') return '&#9670;';
    if (d.type === 'chest') return '&#128230;';
    if (d.type === 'skin') return '&#9733;';
    return '?';
  }

  function rewardLabel(def) {
    if (def.type === 'coins') return '+' + def.amount + ' Coins';
    if (def.type === 'gems') return '+' + def.amount + ' Gems';
    if (def.type === 'chest') return 'A ' + def.amount + ' chest + key';
    if (def.type === 'skin') return 'A free skin';
    if (def.type === 'random') return 'A mystery reward';
    return '';
  }

  function claim(dayNumber, def) {
    var s = RV.Save.get();
    s.dailyReward.streak = dayNumber;
    s.dailyReward.lastClaim = Date.now();
    RV.Save.save();

    if (def.type === 'coins') RV.Progress.addCoins(def.amount);
    else if (def.type === 'gems') RV.Progress.addGems(def.amount);
    else if (def.type === 'chest') { RV.Progress.addChest(def.amount, 1); RV.Progress.addKey(def.amount, 1); }
    else if (def.type === 'skin') RV.Progress.grantRandomSkin();
    else if (def.type === 'random') {
      var roll = Math.random();
      if (roll < 0.5) RV.Progress.addCoins(120);
      else if (roll < 0.85) RV.Progress.addGems(8);
      else RV.Progress.grantRandomSkin();
    }
    RV.UI.renderHeader();
  }

  RV.DailyReward = { checkAndMaybeShow: checkAndMaybeShow };
})(window.RV || (window.RV = {}));


/* ==== js/Leaderboard/LeaderboardData.js ==== */
/* RUSHVERSE - Leaderboard/LeaderboardData.js
   No backend is available, so this generates a stable local leaderboard
   (seeded once, cached) and inserts the player's real best score at the
   correct rank. Built so a real API can replace `generatePool()` later
   without touching the screen code. */
(function (RV) {
  'use strict';

  var NAME_PARTS1 = ['Neo', 'Vex', 'Zed', 'Kai', 'Rin', 'Axl', 'Ivy', 'Jax', 'Lux', 'Mox', 'Nyx', 'Rex', 'Sky', 'Fox', 'Ash', 'Cyn'];
  var NAME_PARTS2 = ['Runner', 'Strike', 'Blaze', 'Storm', 'Shift', 'Bolt', 'Rush', 'Flux', 'Dash', 'Wave', 'Frost', 'Volt'];

  var CACHE_KEY = 'rushverse_lb_pool_v1';

  function seededRandom(seed) {
    var x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }

  function generatePool() {
    var pool = [];
    for (var i = 0; i < 150; i++) {
      var r1 = seededRandom(i * 12.9898);
      var r2 = seededRandom(i * 78.233 + 1);
      var name = NAME_PARTS1[Math.floor(r1 * NAME_PARTS1.length)] + NAME_PARTS2[Math.floor(r2 * NAME_PARTS2.length)];
      var tier = Math.pow(1 - i / 150, 2.2);
      var score = Math.round(400 + tier * 48000 + seededRandom(i * 3.14) * 1500);
      pool.push({ name: name, score: score, level: Math.max(1, Math.round(5 + tier * 60)) });
    }
    pool.sort(function (a, b) { return b.score - a.score; });
    return pool;
  }

  function getPool() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    var pool = generatePool();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(pool)); } catch (e) {}
    return pool;
  }

  function board(category) {
    var s = RV.Save.get();
    var pool = getPool().slice();
    var scaleMap = { global: 1, weekly: 0.32, monthly: 0.62, friends: 1 };
    var scale = scaleMap[category] != null ? scaleMap[category] : 1;
    var entries;
    if (category === 'friends') {
      entries = s.friends.map(function (f) { return { name: f.name, score: f.best, level: f.level, isFriend: true }; });
    } else {
      entries = pool.map(function (p) { return { name: p.name, score: Math.round(p.score * scale), level: p.level }; });
    }
    entries.push({ name: s.playerName, score: category === 'weekly' ? weeklyPlayerScore() : s.bestScore, level: RV.Progress.xpProgress().level, isPlayer: true });
    entries.sort(function (a, b) { return b.score - a.score; });
    var rank = entries.findIndex(function (e) { return e.isPlayer; }) + 1;
    // Never slice the player out of the returned list, even at a low rank —
    // the screen needs their entry to render the "your rank" row.
    return { entries: entries, playerRank: rank, totalCount: entries.length };
  }

  function weeklyPlayerScore() {
    return Math.round(RV.Save.get().bestScore * (0.5 + Math.random() * 0.2));
  }

  function addFriend(code) {
    var s = RV.Save.get();
    code = (code || '').trim().toUpperCase();
    if (!/^RV-[A-Z0-9]{5}$/.test(code)) return { error: 'Invalid code format (RV-XXXXX)' };
    if (code === s.playerCode) return { error: "That's your own code!" };
    if (s.friends.some(function (f) { return f.code === code; })) return { error: 'Already friends' };
    var seed = code.split('').reduce(function (a, c) { return a + c.charCodeAt(0); }, 0);
    var r1 = seededRandom(seed), r2 = seededRandom(seed * 2.1);
    var friend = {
      code: code,
      name: NAME_PARTS1[Math.floor(r1 * NAME_PARTS1.length)] + NAME_PARTS2[Math.floor(r2 * NAME_PARTS2.length)],
      level: Math.max(1, Math.round(3 + r1 * 40)),
      best: Math.round(500 + r2 * 20000),
      online: r1 > 0.4
    };
    s.friends.push(friend);
    RV.Save.save();
    return { friend: friend };
  }

  RV.LeaderboardData = { board: board, addFriend: addFriend };
})(window.RV || (window.RV = {}));


/* ==== js/Leaderboard/Challenge.js ==== */
/* RUSHVERSE - Leaderboard/Challenge.js
   Local/demo challenge mode: no real opponent server, so a friend's
   "attempt" is simulated from their profile once the player's run ends.
   Built so a networked matchmaker could later replace resolveOpponent(). */
(function (RV) {
  'use strict';

  var active = null; // {type: 'score'|'survival', target, friend}

  var TYPES = {
    score: { label: 'Score Race', desc: 'First to {t} points.' },
    survival: { label: 'Survival Duel', desc: 'Whoever survives longest wins.' }
  };

  function start(friend, type) {
    active = { type: type, friend: friend };
    if (type === 'score') active.target = Math.round(friend.best * (0.55 + Math.random() * 0.25));
  }

  function isActive() { return !!active; }

  function resolveOpponent() {
    // Simulated opponent performance derived from the friend's profile.
    var f = active.friend;
    if (active.type === 'score') return Math.round(f.best * (0.4 + Math.random() * 0.5));
    return Math.round((30000 + f.level * 4000) * (0.6 + Math.random() * 0.6));
  }

  function resolve(result) {
    if (!active) return null;
    var playerValue = active.type === 'score' ? result.score : result.survivalMs;
    var opponentValue = resolveOpponent();
    var won = playerValue >= opponentValue;
    var out = {
      type: active.type, friendName: active.friend.name,
      playerValue: playerValue, opponentValue: opponentValue, won: won
    };
    active = null;
    return out;
  }

  RV.Challenge = { TYPES: TYPES, start: start, isActive: isActive, resolve: resolve };
})(window.RV || (window.RV = {}));


/* ==== js/Leaderboard/LeaderboardScreen.js ==== */
/* RUSHVERSE - Leaderboard/LeaderboardScreen.js
   Global / Friends / Weekly / Monthly tabs, top-3 podium, player's own
   rank row, add-friend-by-code, and per-friend Challenge launcher. */
(function (RV) {
  'use strict';

  var el;
  var TABS = ['global', 'friends', 'weekly', 'monthly'];
  var activeTab = 'global';

  function build(container) {
    el = document.createElement('div');
    el.className = 'screen leaderboard-screen';
    el.innerHTML =
      '<div class="screen-title">LEADERBOARD</div>' +
      '<div class="tab-row" id="lbTabs">' + TABS.map(function (t) {
        return '<button class="tab-btn" data-tab="' + t + '">' + t.toUpperCase() + '</button>';
      }).join('') + '</div>' +
      '<div id="lbBody"></div>';
    container.appendChild(el);

    el.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { RV.Audio.sfx.click(); activeTab = btn.dataset.tab; render(); });
    });

    return { el: el, onShow: render };
  }

  function render() {
    el.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === activeTab); });
    var body = el.querySelector('#lbBody');
    if (activeTab === 'friends') {
      body.innerHTML = renderFriendsAdd() + renderBoard('friends');
      bindAddFriend();
      bindChallengeButtons();
    } else {
      body.innerHTML = renderBoard(activeTab);
    }
  }

  function renderFriendsAdd() {
    var s = RV.Save.get();
    return '<div class="friend-code-box">' +
      '<div class="friend-code-label">YOUR PLAYER CODE</div>' +
      '<div class="friend-code-value">' + s.playerCode + '</div>' +
      '<div class="friend-add-row"><input id="friendCodeInput" class="friend-input" placeholder="RV-XXXXX" maxlength="8">' +
      '<button class="menu-btn small-btn" id="friendAddBtn">ADD</button></div></div>';
  }

  function bindAddFriend() {
    var btn = el.querySelector('#friendAddBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var input = el.querySelector('#friendCodeInput');
      var res = RV.LeaderboardData.addFriend(input.value);
      if (res.error) { RV.UI.toast(res.error, '#ff6a6a'); }
      else { RV.Audio.sfx.powerup(); RV.UI.toast(res.friend.name + ' added!', '#7dff5a'); render(); }
    });
  }

  function renderBoard(category) {
    var data = RV.LeaderboardData.board(category);
    var entries = data.entries;
    if (category === 'friends' && entries.length <= 1) {
      return '<div class="empty-state">No friends yet — add one with a player code above!</div>';
    }
    if (category === 'friends') {
      // Small lists: skip the podium (it has no room for a Challenge button)
      // and just list everyone with their rank + challenge action.
      return '<div class="lb-list">' + entries.map(function (e, i) { return rowHtml(i + 1, e, category); }).join('') + '</div>';
    }
    var top3 = entries.slice(0, 3);
    var podium = '<div class="podium-row">' + top3.map(function (e, i) {
      return '<div class="podium-item rank-' + (i + 1) + '">' +
        '<div class="podium-rank">#' + (i + 1) + '</div>' +
        '<div class="podium-avatar"></div>' +
        '<div class="podium-name">' + e.name + '</div>' +
        '<div class="podium-score">' + RV.UI.fmt(e.score) + '</div></div>';
    }).join('') + '</div>';

    var rest = entries.slice(3, 30).map(function (e, i) {
      var rank = i + 4;
      return rowHtml(rank, e, category);
    }).join('');

    var playerRow = '';
    if (data.playerRank > 30) {
      var playerEntry = entries.filter(function (e) { return e.isPlayer; })[0];
      playerRow = '<div class="lb-divider">&#8942;</div>' + rowHtml(data.playerRank, playerEntry, category);
    }

    return podium + '<div class="lb-list">' + rest + playerRow + '</div>';
  }

  function rowHtml(rank, e, category) {
    var challengeBtn = (category === 'friends' && !e.isPlayer)
      ? '<button class="challenge-btn" data-name="' + e.name + '">CHALLENGE</button>' : '';
    return '<div class="lb-row ' + (e.isPlayer ? 'is-player' : '') + '">' +
      '<div class="lb-rank">#' + rank + '</div>' +
      '<div class="lb-name">' + (e.isPlayer ? 'YOU' : e.name) + '</div>' +
      '<div class="lb-score">' + RV.UI.fmt(e.score) + '</div>' + challengeBtn + '</div>';
  }

  function bindChallengeButtons() {
    el.querySelectorAll('.challenge-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var s = RV.Save.get();
        var friend = s.friends.filter(function (f) { return f.name === btn.dataset.name; })[0];
        if (!friend) return;
        openChallengeModal(friend);
      });
    });
  }

  function openChallengeModal(friend) {
    var card = RV.UI.modal(
      '<div class="levelup-title">CHALLENGE ' + friend.name.toUpperCase() + '</div>' +
      '<div class="challenge-type-row">' +
        '<button class="menu-btn challenge-type-btn" data-type="score">SCORE RACE</button>' +
        '<button class="menu-btn secondary challenge-type-btn" data-type="survival">SURVIVAL DUEL</button>' +
      '</div>'
    );
    card.querySelectorAll('.challenge-type-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        RV.Audio.sfx.click();
        RV.Challenge.start(friend, btn.dataset.type);
        RV.UI.closeModal();
        var save = RV.Save.get();
        RV.UI.show('game');
        RV.HUD.startMatch(save.characters.equipped, save.maps.unlocked[0], {});
      });
    });
  }

  RV.LeaderboardScreen = { build: build };
})(window.RV || (window.RV = {}));


/* ==== js/Settings/SettingsScreen.js ==== */
/* RUSHVERSE - Settings/SettingsScreen.js
   Music/SFX volume, graphics quality, vibration, language, controls side,
   account info, and a guarded reset-data action. */
(function (RV) {
  'use strict';

  var el;
  var LANG_LABELS = { en: 'English', he: 'עברית' };

  function build(container) {
    el = document.createElement('div');
    el.className = 'screen settings-screen';
    container.appendChild(el);
    return { el: el, onShow: render };
  }

  function render() {
    var s = RV.Save.get().settings;
    var save = RV.Save.get();
    el.innerHTML =
      '<div class="screen-title">SETTINGS</div>' +
      '<div class="settings-list">' +
        sliderRow('Music Volume', 'musicVolume', s.musicVolume) +
        sliderRow('SFX Volume', 'sfxVolume', s.sfxVolume) +
        segmentRow('Graphics', 'graphics', s.graphics, ['low', 'medium', 'high']) +
        toggleRow('Vibration', 'vibration', s.vibration) +
        segmentRow('Language', 'language', s.language, ['en', 'he'], LANG_LABELS) +
        segmentRow('Joystick Side', 'joystickSide', s.joystickSide, ['left', 'right']) +
        '<div class="settings-section-title">ACCOUNT</div>' +
        '<div class="settings-row"><span>Player Code</span><span class="stat-row-val">' + save.playerCode + '</span></div>' +
        '<div class="settings-row"><span>Level</span><span class="stat-row-val">' + RV.Progress.xpProgress().level + '</span></div>' +
        '<button class="menu-btn danger-btn" id="resetDataBtn">RESET DATA</button>' +
      '</div>';

    el.querySelectorAll('input[type=range]').forEach(function (input) {
      input.addEventListener('input', function () {
        var save2 = RV.Save.get();
        save2.settings[input.dataset.key] = parseFloat(input.value);
        RV.Save.save();
        RV.Audio.applyVolumes();
      });
    });
    el.querySelectorAll('.segment-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        RV.Audio.sfx.click();
        var save2 = RV.Save.get();
        save2.settings[btn.dataset.key] = btn.dataset.value;
        RV.Save.save();
        if (btn.dataset.key === 'joystickSide') RV.Controls.applySide();
        render();
      });
    });
    el.querySelectorAll('.toggle-switch').forEach(function (t) {
      t.addEventListener('click', function () {
        RV.Audio.sfx.click();
        var save2 = RV.Save.get();
        save2.settings[t.dataset.key] = !save2.settings[t.dataset.key];
        RV.Save.save();
        render();
      });
    });
    el.querySelector('#resetDataBtn').addEventListener('click', confirmReset);
  }

  function sliderRow(label, key, value) {
    return '<div class="settings-row"><span>' + label + '</span>' +
      '<input type="range" min="0" max="1" step="0.05" value="' + value + '" data-key="' + key + '" class="volume-slider"></div>';
  }
  function toggleRow(label, key, value) {
    return '<div class="settings-row"><span>' + label + '</span>' +
      '<div class="toggle-switch ' + (value ? 'on' : '') + '" data-key="' + key + '"><div class="toggle-knob"></div></div></div>';
  }
  function segmentRow(label, key, value, options, labels) {
    return '<div class="settings-row col"><span>' + label + '</span><div class="segment-group">' +
      options.map(function (o) {
        return '<button class="segment-btn ' + (o === value ? 'active' : '') + '" data-key="' + key + '" data-value="' + o + '">' +
          (labels ? labels[o] : o.toUpperCase()) + '</button>';
      }).join('') + '</div></div>';
  }

  function confirmReset() {
    var card = RV.UI.modal(
      '<div class="levelup-title" style="color:#ff6a6a">RESET ALL DATA?</div>' +
      '<div class="item-desc" style="text-align:center;margin:8px 0 18px">This permanently deletes your progress, currency, and unlocks. This cannot be undone.</div>' +
      '<button class="menu-btn danger-btn" id="confirmResetBtn">YES, RESET</button>' +
      '<button class="menu-btn secondary" id="cancelResetBtn">CANCEL</button>'
    );
    card.querySelector('#confirmResetBtn').addEventListener('click', function () {
      RV.Save.reset();
      RV.UI.closeModal();
      RV.UI.renderHeader();
      RV.UI.show('home');
      RV.UI.toast('Data reset', '#ff6a6a');
    });
    card.querySelector('#cancelResetBtn').addEventListener('click', function () { RV.UI.closeModal(); });
  }

  RV.SettingsScreen = { build: build };
})(window.RV || (window.RV = {}));


/* ==== js/main.js ==== */
/* RUSHVERSE - main.js
   Boot sequence: build every screen, wire the bottom nav, load save data,
   and show the home screen. Kept deliberately thin — all real logic lives
   in the feature modules under /js. */
(function (RV) {
  'use strict';

  var NAV_ITEMS = [
    { id: 'shop', label: 'SHOP', icon: '&#128722;' },
    { id: 'collection', label: 'COLLECTION', icon: '&#127942;' },
    { id: 'home', label: 'HOME', icon: '&#9733;', isHome: true },
    { id: 'missions', label: 'MISSIONS', icon: '&#128203;' },
    { id: 'leaderboard', label: 'RANKS', icon: '&#128200;' }
  ];

  function buildBottomNav() {
    var nav = document.getElementById('bottomNav');
    nav.innerHTML = NAV_ITEMS.map(function (item) {
      return '<button class="nav-btn ' + (item.isHome ? 'nav-home' : '') + '" data-screen="' + item.id + '">' +
        '<span class="nav-icon">' + item.icon + '</span><span class="nav-label">' + item.label + '</span></button>';
    }).join('') + '<button class="nav-btn" data-screen="settings"><span class="nav-icon">&#9881;</span><span class="nav-label">SETTINGS</span></button>';

    nav.querySelectorAll('.nav-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        RV.Audio.resume(); RV.Audio.sfx.click();
        RV.UI.show(btn.dataset.screen);
        updateNavActive(btn.dataset.screen);
      });
    });
  }

  function updateNavActive(screen) {
    document.querySelectorAll('.nav-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.screen === screen);
    });
  }

  function boot() {
    RV.Save.get(); // ensure loaded

    var stage = document.getElementById('stage');
    RV.UI.registerScreen('home', RV.HomeScreen.build(stage));
    RV.UI.registerScreen('game', RV.HUD.build(stage));
    RV.UI.registerScreen('gameover', RV.GameOverScreen.build(stage));
    RV.UI.registerScreen('tutorial', RV.TutorialScreen.build(stage));
    RV.UI.registerScreen('shop', RV.ShopScreen.build(stage));
    RV.UI.registerScreen('collection', RV.CollectionScreen.build(stage));
    RV.UI.registerScreen('missions', RV.MissionsScreen.build(stage));
    RV.UI.registerScreen('leaderboard', RV.LeaderboardScreen.build(stage));
    RV.UI.registerScreen('settings', RV.SettingsScreen.build(stage));

    RV.UI.init(document.getElementById('app'));
    buildBottomNav();
    updateNavActive('home');
    RV.UI.show('home');

    RV.Progress.on('achievementComplete', function (a) {
      RV.UI.toast('Achievement unlocked: ' + a.name, '#ffce45');
    });
    RV.Progress.on('characterUnlocked', function (c) {
      if (c) RV.UI.toast('Character unlocked: ' + c.name, c.color);
    });
    RV.Progress.on('mapUnlocked', function (m) {
      if (m) RV.UI.toast('Map unlocked: ' + m.name, '#7ad9ff');
    });

    setTimeout(function () { RV.DailyReward.checkAndMaybeShow(); }, 500);

    document.getElementById('bootLoader').classList.add('hidden');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window.RV || (window.RV = {}));

</script>
