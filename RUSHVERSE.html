<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RUSHVERSE</title>
<meta name="description" content="RUSHVERSE — fast-paced third-person arena action for mobile.">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060810">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%237c4dff'/%3E%3Cpath d='M30 70 L55 30 L48 30 L70 30 L45 70 Z' fill='%2300e5ff'/%3E%3C/svg%3E">
<style>
/* RUSHVERSE - css/style.css */
:root {
  --bg: #060810;
  --panel: rgba(18, 22, 36, 0.86);
  --panel-light: rgba(30, 36, 56, 0.9);
  --accent: #7c4dff;
  --accent2: #ff3bd6;
  --cyan: #00e5ff;
  --gold: #ffce45;
  --green: #7dff5a;
  --red: #ff3860;
  --text: #eef2ff;
  --text-dim: #8fa0c0;
  --radius: 16px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: var(--bg);
  font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  color: var(--text); user-select: none; touch-action: none; overscroll-behavior: none;
}
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
input { font-family: inherit; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; background:
  radial-gradient(circle at 20% -10%, #241a4a 0%, transparent 55%),
  radial-gradient(circle at 90% 110%, #4a1440 0%, transparent 50%), var(--bg); }

/* ---------- Top header (currency / level) ---------- */
#topHeader {
  display: flex; align-items: center; gap: 8px; padding: calc(10px + var(--safe-top)) 14px 10px;
  flex-shrink: 0; z-index: 30; transition: opacity 0.2s, transform 0.2s;
}
#topHeader.hidden { opacity: 0; pointer-events: none; transform: translateY(-10px); }
.curr-pill {
  display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; backdrop-filter: blur(8px);
}
.coin-pill .curr-icon { color: var(--gold); }
.gem-pill .curr-icon { color: var(--cyan); }
.level-block { flex: 1; display: flex; align-items: center; gap: 8px; }
.level-badge {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); padding: 5px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 800; letter-spacing: 0.5px; flex-shrink: 0;
}
.xp-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--accent)); transition: width 0.4s ease; }
.bell-btn { position: relative; background: var(--panel); width: 34px; height: 34px; border-radius: 50%; font-size: 15px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.08); }
.bell-badge { position: absolute; top: -4px; right: -4px; background: var(--red); color: #fff; font-size: 9px; font-weight: 800; min-width: 16px; height: 16px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
.notif-list { max-height: 50vh; overflow-y: auto; margin: 10px 0 16px; text-align: left; }
.notif-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; background: var(--cyan); }
.notif-success { background: var(--green); }
.notif-event { background: var(--accent2); }
.notif-info { background: var(--cyan); }
.notif-text { font-size: 13px; line-height: 1.4; }

/* ---------- Stage / screens ---------- */
#stage { position: relative; flex: 1; overflow: hidden; }
.screen {
  position: absolute; inset: 0; opacity: 0; pointer-events: none; transform: translateY(14px);
  transition: opacity 0.28s ease, transform 0.28s ease; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: calc(20px + var(--safe-bottom));
}
.screen.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
.game-screen.active { overflow: hidden; }

/* ---------- Bottom nav ---------- */
#bottomNav {
  display: flex; flex-shrink: 0; background: var(--panel); border-top: 1px solid rgba(255,255,255,0.06);
  padding: 6px 4px calc(6px + var(--safe-bottom)); backdrop-filter: blur(10px); z-index: 30; transition: opacity 0.2s, transform 0.2s;
}
#bottomNav.hidden { opacity: 0; pointer-events: none; transform: translateY(10px); }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--text-dim); transition: color 0.15s, transform 0.1s; }
.nav-btn.active { color: var(--cyan); }
.nav-btn:active { transform: scale(0.92); }
.nav-icon { font-size: 18px; }
.nav-label { font-size: 9px; font-weight: 700; letter-spacing: 0.4px; }
.nav-home .nav-icon { font-size: 22px; color: var(--gold); }

/* ---------- Home screen ---------- */
.home-screen { display: flex; flex-direction: column; align-items: center; padding-top: 6vh; }
.home-glow {
  position: absolute; top: -20%; left: 50%; width: 140%; height: 60%; transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(124,77,255,0.35), transparent 65%); pointer-events: none;
}
.logo-wrap { text-align: center; margin-bottom: 4vh; animation: floatLogo 4s ease-in-out infinite; }
@keyframes floatLogo { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.logo-title { font-size: 42px; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 24px rgba(124,77,255,0.7); }
.logo-accent { background: linear-gradient(90deg, var(--cyan), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo-sub { font-size: 12px; letter-spacing: 6px; color: var(--text-dim); margin-top: 4px; }

.season-bar {
  width: 100%; max-width: 380px; margin: 0 auto 12px; padding: 10px 16px; background: var(--panel); border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,0.08); cursor: pointer;
}
.season-bar-top { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 6px; }
.season-name { color: var(--gold); }
.season-time { color: var(--text-dim); }
.season-progress { height: 6px; margin-bottom: 5px; }
.season-level-label { font-size: 9px; letter-spacing: 1px; color: var(--text-dim); text-align: center; }
.quick-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; padding: 0 12px; max-width: 420px; margin-left: auto; margin-right: auto; }
.quick-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: var(--panel); border-radius: 12px; padding: 8px 6px; flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,0.06); }
.quick-btn:active { transform: scale(0.93); }
.quick-icon { font-size: 18px; }
.quick-label { font-size: 7.5px; font-weight: 800; letter-spacing: 0.2px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.picker-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; width: 100%; max-width: 380px; padding: 0 12px; }
.picker-arrow { background: var(--panel); width: 38px; height: 38px; border-radius: 50%; font-size: 16px; flex-shrink: 0; }
.picker-arrow:active { transform: scale(0.9); }
.picker-card { flex: 1; background: var(--panel); border-radius: var(--radius); padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.06); }
.char-avatar { width: 56px; height: 68px; border-radius: 50% 50% 45% 45%; margin: 0 auto 8px; box-shadow: 0 0 20px rgba(124,77,255,0.5); cursor: pointer; }
.emote-hint { font-size: 9px; color: var(--text-dim); opacity: 0.6; margin-top: 2px; }
.emote-wave { animation: emoteWave 0.7s ease; }
.emote-flex { animation: emoteFlex 0.6s ease; }
.emote-spin { animation: emoteSpin 0.7s ease; }
.emote-bow { animation: emoteBow 0.8s ease; }
.emote-starburst { animation: emoteStarburst 0.8s ease; }
@keyframes emoteWave { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
@keyframes emoteFlex { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
@keyframes emoteSpin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
@keyframes emoteBow { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(10px) rotate(15deg); } }
@keyframes emoteStarburst { 0% { box-shadow: 0 0 0 rgba(255,255,255,0); } 40% { box-shadow: 0 0 40px 10px rgba(255,255,255,0.7); } 100% { box-shadow: 0 0 20px rgba(124,77,255,0.5); } }
.map-avatar { width: 100%; height: 46px; border-radius: 10px; margin-bottom: 8px; position: relative; overflow: hidden; }
.map-avatar-glow { position: absolute; bottom: -10px; left: 20%; width: 60%; height: 30px; border-radius: 50%; filter: blur(14px); opacity: 0.6; }
.picker-name { font-weight: 800; font-size: 15px; }
.picker-sub { font-size: 10px; font-weight: 700; letter-spacing: 1px; margin: 2px 0; }
.picker-desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; min-height: 28px; }

.play-btn {
  margin-top: 12px; width: 200px; height: 64px; border-radius: 999px; font-size: 24px; font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(135deg, var(--cyan), var(--accent) 55%, var(--accent2)); color: #fff;
  box-shadow: 0 8px 30px rgba(124,77,255,0.55), inset 0 2px 0 rgba(255,255,255,0.3);
  animation: pulsePlay 2.2s ease-in-out infinite;
}
@keyframes pulsePlay { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
.play-btn:active { transform: scale(0.94); }
.best-score-line { margin-top: 14px; font-size: 12px; letter-spacing: 2px; color: var(--text-dim); font-weight: 700; }

/* ---------- Generic screen chrome ---------- */
.screen-title { font-size: 22px; font-weight: 900; letter-spacing: 2px; text-align: center; padding: 18px 0 10px; }
.tab-row { display: flex; gap: 6px; padding: 0 12px 12px; overflow-x: auto; }
.tab-btn { flex-shrink: 0; padding: 8px 16px; border-radius: 999px; background: var(--panel); font-weight: 700; font-size: 12px; letter-spacing: 0.5px; color: var(--text-dim); border: 1px solid rgba(255,255,255,0.06); }
.tab-btn.active { background: linear-gradient(135deg, var(--accent), var(--cyan)); color: #fff; }

/* ---------- Item grid / shop ---------- */
.item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px 20px; }
.item-card { background: var(--panel); border-radius: var(--radius); padding: 12px; text-align: center; border: 2px solid rgba(255,255,255,0.06); }
.rarity-border-common { border-color: #9aa5b1; }
.rarity-border-uncommon { border-color: #5fd97a; }
.rarity-border-rare { border-color: #4fa8ff; }
.rarity-border-epic { border-color: #b968ff; }
.rarity-border-legendary { border-color: #ffb23e; box-shadow: 0 0 14px rgba(255,178,62,0.3); }
.rarity-border-mythic { border-color: #ff5ec8; box-shadow: 0 0 16px rgba(255,94,200,0.4); }
.item-preview { width: 100%; height: 64px; border-radius: 10px; margin-bottom: 8px; }
.item-name { font-weight: 800; font-size: 13px; }
.item-rarity { font-size: 9px; font-weight: 800; letter-spacing: 1px; margin: 2px 0 6px; }
.rarity-common { color: #9aa5b1; } .rarity-uncommon { color: #5fd97a; } .rarity-rare { color: #4fa8ff; }
.rarity-epic { color: #b968ff; } .rarity-legendary { color: #ffb23e; } .rarity-mythic { color: #ff5ec8; }
.item-desc { font-size: 10px; color: var(--text-dim); min-height: 14px; margin-bottom: 6px; }
.item-btn { width: 100%; padding: 8px 4px; border-radius: 10px; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
.buy-btn { background: linear-gradient(135deg, var(--cyan), var(--accent)); color: #fff; }
.buy-btn:active { transform: scale(0.95); }
.owned-btn { background: rgba(125,255,90,0.18); color: var(--green); border: 1px solid rgba(125,255,90,0.4); }
.locked-btn { background: rgba(255,255,255,0.05); color: var(--text-dim); }
.coin-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.featured-tag { position: absolute; top: 8px; left: 8px; background: linear-gradient(135deg, var(--gold), var(--accent2)); color: #1a1200; font-size: 8px; font-weight: 900; letter-spacing: 0.5px; padding: 3px 7px; border-radius: 6px; }
.item-card { position: relative; }
.item-btn-row { display: flex; gap: 6px; }
.item-btn-row .item-btn { flex: 1; padding: 8px 2px; font-size: 10px; }
.preview-btn { background: rgba(255,255,255,0.08); color: var(--text); }
.preview-canvas { display: block; margin: 0 auto 10px; background: radial-gradient(circle, #12162a, #060810); border-radius: 16px; }
.preview-rotate-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }

/* ---------- Missions / achievements ---------- */
.list-col { display: flex; flex-direction: column; gap: 10px; padding: 0 12px 20px; }
.mission-row { display: flex; gap: 10px; background: var(--panel); border-radius: var(--radius-sm); padding: 12px; align-items: center; }
.mission-info { flex: 1; }
.mission-name { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.mission-desc { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.progress-bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); transition: width 0.3s; }
.progress-label { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
.mission-reward { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
.reward-chip { font-size: 11px; font-weight: 800; color: var(--gold); background: rgba(255,206,69,0.12); padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
.claim-btn, .claim-mission-btn { padding: 6px 12px; font-size: 10px; }
.claimed-tag { font-size: 10px; color: var(--text-dim); font-weight: 700; }
.quest-row { display: flex; gap: 10px; background: var(--panel); border-radius: var(--radius-sm); padding: 12px; align-items: center; margin-bottom: 10px; }
.quest-row.done { opacity: 0.55; }
.quest-row.active { border: 1px solid var(--cyan); }
.quest-check { color: var(--green); font-size: 18px; font-weight: 900; flex-shrink: 0; }
.quest-info { flex: 1; }
.quest-name { font-weight: 800; font-size: 13px; margin-bottom: 2px; }
.quest-desc { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
.quest-final-banner { text-align: center; background: linear-gradient(135deg, rgba(255,206,69,0.15), rgba(255,59,214,0.15)); border-radius: var(--radius); padding: 18px; margin-top: 4px; }

/* ---------- Collection: chests / stats ---------- */
.chest-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px 20px; }
.chest-card { background: var(--panel); border-radius: var(--radius); padding: 16px; text-align: center; border: 2px solid rgba(255,255,255,0.06); }
.chest-icon { font-size: 34px; margin-bottom: 6px; }
.book-locked { opacity: 0.55; filter: grayscale(1); }
.book-locked-preview { display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: var(--text-dim); background: rgba(255,255,255,0.05); }
.book-badge-preview { display: flex; align-items: center; justify-content: center; font-size: 28px; background: linear-gradient(160deg, rgba(255,178,62,0.25), transparent); }
.stats-grid { padding: 0 12px 20px; display: flex; flex-direction: column; gap: 8px; }
.stat-row { display: flex; justify-content: space-between; background: var(--panel); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; }
.stat-row-val { font-weight: 800; color: var(--cyan); }

/* ---------- Leaderboard ---------- */
.friend-code-box { margin: 0 12px 16px; background: var(--panel); border-radius: var(--radius); padding: 14px; text-align: center; }
.friend-code-label { font-size: 10px; letter-spacing: 1px; color: var(--text-dim); }
.friend-code-value { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: var(--cyan); margin: 4px 0 10px; }
.friend-add-row { display: flex; gap: 8px; }
.friend-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: #fff; font-weight: 700; text-align: center; letter-spacing: 1px; }
.small-btn { padding: 0 16px; font-size: 12px; }
.podium-row { display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 6px 16px 18px; }
.podium-item { background: var(--panel); border-radius: var(--radius-sm); padding: 10px; text-align: center; width: 90px; }
.podium-item.rank-1 { padding-bottom: 18px; border: 1px solid rgba(255,178,62,0.5); }
.podium-item.rank-2 { border: 1px solid rgba(154,165,177,0.5); }
.podium-item.rank-3 { border: 1px solid rgba(255,138,62,0.4); }
.podium-avatar { width: 32px; height: 32px; border-radius: 50%; margin: 4px auto; background: linear-gradient(135deg, var(--cyan), var(--accent)); }
.podium-rank { font-weight: 900; font-size: 13px; color: var(--gold); }
.podium-name { font-size: 11px; font-weight: 700; }
.podium-score { font-size: 12px; font-weight: 800; color: var(--cyan); }
.lb-list { padding: 0 12px 20px; display: flex; flex-direction: column; gap: 6px; }
.lb-row { display: flex; align-items: center; gap: 10px; background: var(--panel); padding: 10px 12px; border-radius: var(--radius-sm); }
.lb-row.is-player { border: 1px solid var(--cyan); background: rgba(0,229,255,0.08); }
.lb-rank { width: 36px; font-weight: 800; color: var(--text-dim); font-size: 12px; }
.lb-name { flex: 1; font-weight: 700; font-size: 13px; }
.lb-score { font-weight: 800; color: var(--gold); font-size: 13px; }
.lb-divider { text-align: center; color: var(--text-dim); }
.challenge-btn { background: rgba(255,59,214,0.15); color: var(--accent2); border: 1px solid rgba(255,59,214,0.4); border-radius: 8px; padding: 5px 10px; font-size: 10px; font-weight: 800; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.friend-actions { display: flex; gap: 4px; }
.friend-action-btn { width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,0.08); font-size: 12px; }
.friend-action-btn:active { transform: scale(0.9); }
.demo-banner { margin: 0 12px 16px; font-size: 11px; line-height: 1.5; color: var(--text-dim); background: rgba(255,206,69,0.08); border: 1px solid rgba(255,206,69,0.25); border-radius: var(--radius-sm); padding: 10px 12px; }
.party-section { margin: 0 12px 18px; background: var(--panel); border-radius: var(--radius); padding: 16px; }
.party-section-title { font-size: 12px; letter-spacing: 1px; font-weight: 800; color: var(--gold); margin-bottom: 10px; }
.party-desc { font-size: 11px; color: var(--text-dim); margin: 8px 0; }
.party-code-line { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.party-code-line span { color: var(--cyan); font-weight: 900; letter-spacing: 2px; }
.party-members { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.party-member-row { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 8px 10px; }
.party-member-name { flex: 1; font-size: 12px; font-weight: 700; }
.party-member-status { font-size: 10px; font-weight: 800; }
.party-kick-btn { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.08); font-size: 10px; }
.empty-state { text-align: center; color: var(--text-dim); padding: 30px; font-size: 13px; }
.challenge-type-row { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.challenge-vs-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 14px 0; }
.challenge-side { text-align: center; }
.challenge-name { font-size: 12px; color: var(--text-dim); font-weight: 700; }
.challenge-value { font-size: 20px; font-weight: 900; color: var(--cyan); }
.challenge-vs { font-weight: 900; color: var(--text-dim); }

/* ---------- Battle Pass ---------- */
.bp-header { text-align: center; padding: 0 16px 14px; }
.bp-season-name { font-size: 11px; letter-spacing: 2px; color: var(--gold); font-weight: 800; margin-bottom: 4px; }
.bp-level-big { font-size: 28px; font-weight: 900; }
.bp-level-max { font-size: 14px; color: var(--text-dim); font-weight: 700; }
.bp-progress { margin: 8px 0 10px; height: 8px; }
.bp-premium-owned { font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: 1px; background: rgba(255,206,69,0.12); padding: 6px 12px; border-radius: 999px; display: inline-block; }
.bp-buy-btn { max-width: 260px; margin: 0 auto; font-size: 13px; }
.gem-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); }
.bp-track-labels { display: flex; justify-content: space-between; padding: 0 20px; font-size: 10px; letter-spacing: 2px; color: var(--text-dim); font-weight: 800; margin-bottom: 6px; }
.bp-track { padding: 0 12px 24px; display: flex; flex-direction: column; gap: 8px; }
.bp-row { display: grid; grid-template-columns: 1fr 34px 1fr; align-items: center; gap: 8px; background: var(--panel); border-radius: var(--radius-sm); padding: 8px; }
.bp-row.unlocked { border: 1px solid rgba(0,229,255,0.25); }

/* ---------- Controls layer ----------
   NOTE: .game-screen is only truly hidden via opacity/pointer-events:none on

}

.swipe-zone { position: absolute; inset: 0; z-index: -1; }

  // ---------- Meta Events (rotating scheduled events, distinct from in-run random events) ----------

      index: idx, total: list.length, done: done, claimedFinal: s.quests.claimedFinal,

        progress: progress, target: current.target,

    if (reward.gems) addGems(reward.gems);

      facing: Math.round(p.facing * 100) / 100, hp: p.hp, score: Math.round(match.score), combo: match.combo.count

    if (match.replay.samples.length > 600) match.replay.samples.shift();
  }
  function recordReplayMoment(type, label, color) {
    if (!match || !match.replay) return;
    match.replay.moments.push({ t: Math.round(match.elapsed * 10) / 10, x: match.player.x, z: match.player.z, type: type, label: label, color: color });
    if (match.replay.moments.length > 300) match.replay.moments.shift();
  }

  function onEventTrigger(phase, key) {
    if (phase === 'start') {
      RV.Audio.sfx.eventAlert();
      fire('eventBanner', RV.Events.DEFS[key].label);
      if (key === 'giantEnemy' && !match.enemies.some(function (e) { return e.type === 'boss'; })) {
        spawnEnemy('boss');
      }
      if (key === 'coinRain') {
        for (var i = 0; i < 4; i++) spawnCoin();
      }
    }
  }

  function updateObstacles(dt, difficulty) {
    var speedMul = match.globalSlowTimer > 0 ? 0.4 : (match.events.active === 'speedMode' ? 1.5 : 1) * Math.min(1.6, 0.9 + difficulty * 0.12);
    match.obstacles.forEach(function (o) { RV.Obstacles.update(o, dt, ARENA_RADIUS, speedMul); });
  }

  function updateEnemies(dt) {
    var p = match.player;
    for (var i = match.enemies.length - 1; i >= 0; i--) {
      var e = match.enemies[i];
      if (match.globalSlowTimer > 0) RV.Enemy.applySlow(e, 0.1);
      RV.Enemy.update(e, dt, p.x, p.z, match.projectiles);
      if (!e.alive) match.enemies.splice(i, 1);
    }
  }

  function updateProjectiles(dt) {
    var p = match.player;
    for (var i = match.projectiles.length - 1; i >= 0; i--) {
      var pr = match.projectiles[i];
      pr.x += pr.dx * pr.speed * dt;
      pr.z += pr.dz * pr.speed * dt;
      pr.life -= dt;
      var dead = pr.life <= 0 || Math.hypot(pr.x, pr.z) > ARENA_RADIUS * 1.4;
      if (!dead && !RV.Player.isInvulnerable(p) && Math.hypot(pr.x - p.x, pr.z - p.z) < pr.radius + p.radius) {
        RV.Player.applyHit(p);
        dead = true;
      }
      if (dead) match.projectiles.splice(i, 1);
    }
  }

  function updatePickups(dt) {
    var p = match.player;
    var magnetActive = p.status.magnetTimer > 0 || match.events.active === 'magnetStorm';
    for (var i = match.pickups.length - 1; i >= 0; i--) {
      var item = match.pickups[i];
      RV.Pickups.update(item, dt, p.x, p.z, magnetActive);
      if (RV.Pickups.checkPickup(item, p.x, p.z, p.radius)) {
        collectPickup(item);
        match.pickups.splice(i, 1);
      }
    }
  }

  function collectPickup(item) {
    var mult = comboScoreMultiplier();
    if (item.kind === 'coin') {
      RV.Progress.addCoins(item.value);
      match.coinsCollected += item.value;
      RV.Progress.updateTrackedStat('coinsThisPeriod', item.value, 'add');
      addScore(COIN_SCORE * mult);
      RV.Audio.sfx.coin();
      RV.Effects.floatText(item.x, item.z, '+' + item.value, '#ffce45');
      registerCombo('coin');
      registerMultiCollect();
    } else if (item.kind === 'gem') {
      RV.Progress.addGems(item.value);
      match.gemsCollected += item.value;
      addScore(GEM_SCORE * mult);
      RV.Audio.sfx.gem();
      RV.Effects.floatText(item.x, item.z, '+' + item.value + ' GEM', '#7ad9ff');
      registerMultiCollect();
    } else {
      RV.Player.grantPowerup(match.player, item.ptype);
      RV.Audio.sfx.powerup();
      RV.Effects.floatText(item.x, item.z, RV.Pickups.POWERUP_META[item.ptype].icon.toUpperCase(), RV.Pickups.POWERUP_META[item.ptype].color, { size: 20 });
      RV.Effects.burst(item.x, item.z, RV.Pickups.POWERUP_META[item.ptype].color, { count: 18 });
    }
  }

  function resolveCollisions(dt) {
    var p = match.player;
    var invuln = RV.Player.isInvulnerable(p);
    var wasDashing = RV.Player.isDashing(p) || RV.Player.isSwiping(p);
    var anySlow = false;

    match.obstacles.forEach(function (o) {
      var res = RV.Obstacles.checkCollision(o, p.x, p.z, p.radius, RV.Player.isAirborne(p));
      if (res.slow) anySlow = true;
      if (res.danger && !invuln) {
        RV.Player.applyHit(p);
      } else if (res.danger && wasDashing) {
        // dashed straight through danger: rewarded in checkPerfectDash on dash-start,
        // but also reward continuous pass-through for swipe dodges mid-hazard.
      }
    });
    p.status.slowedByField = anySlow;
    if (anySlow) p.status.slowedTimer = Math.max(p.status.slowedTimer, 0.15);

    if (!invuln) {
      match.enemies.forEach(function (e) {
        var d = Math.hypot(e.x - p.x, e.z - p.z);
        if (d < e.radius + p.radius) RV.Player.applyHit(p);

    }

    if (RV.Player.isDashing(p)) {
      match.enemies.forEach(function (e) {
        var d = Math.hypot(e.x - p.x, e.z - p.z);

  function render() {
    if (!match) return;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    var shakeOff = RV.Effects.getShakeOffset();
    ctx.save();
    ctx.translate(shakeOff.x, shakeOff.y);

    RV.Maps.render(ctx, { width: w, height: h }, match.map, ARENA_RADIUS, project, match.events.active === 'blackout');

    var drawables = [];
    match.obstacles.forEach(function (o) { drawables.push({ z: o.z, fn: function () { RV.Obstacles.draw(ctx, o, project); } }); });
    match.pickups.forEach(function (item) { drawables.push({ z: item.z, fn: function () { RV.Pickups.draw(ctx, item, project); } }); });
    match.enemies.forEach(function (e) { drawables.push({ z: e.z, fn: function () { RV.Enemy.draw(ctx, e, project); } }); });
    match.projectiles.forEach(function (pr) { drawables.push({ z: pr.z, fn: function () {
      var pos = project(pr.x, pr.z);
      if (!pos || pos.cull) return;
      ctx.fillStyle = '#ffdd66'; ctx.shadowColor = '#ffdd66'; ctx.shadowBlur = 8 * pos.scale;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, 5 * pos.scale, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    } }); });
    drawables.push({ z: match.player.z, fn: function () { RV.Player.draw(ctx, match.player, project, match.skin); } });
    drawables.sort(function (a, b) { return a.z - b.z; });
    drawables.forEach(function (d) { d.fn(); });

    RV.Effects.drawWorldParticles(ctx, project);
    RV.Effects.drawScreenFloaters(ctx, project);

    ctx.restore();
  }

  function getHudState() {
    var p = match.player;
    return {
      score: Math.round(match.displayScore),
      combo: match.combo.count,
      hp: p.hp, maxHp: p.maxHp,
      abilityReady: p.abilityCooldown <= 0,
      abilityPct: 1 - p.abilityCooldown / (p.character.ability.cooldown / 1000),
      elapsed: match.elapsed,
      eventBanner: match.events.banner,
      coins: match.coinsCollected,
      shieldActive: p.status.shieldTimer > 0,
      speedActive: p.status.speedTimer > 0,
      magnetActive: p.status.magnetTimer > 0,
      multiplierActive: p.status.multiplierTimer > 0
    };
  }

  function endMatch() {
    if (match.ended) return;
    match.ended = true;
    stop();
    var save = RV.Save.get();
    var survivalMs = match.elapsed * 1000;
    var isNewBest = match.score > save.bestScore;

    save.gamesPlayed += 1;
    save.bestScore = Math.max(save.bestScore, Math.round(match.score));
    save.bestCombo = Math.max(save.bestCombo, match.combo.best);
    save.bestSurvivalMs = Math.max(save.bestSurvivalMs, survivalMs);
    save.totalSurvivalMs += survivalMs;
    save.abilityUses += match.abilityUses;
    save.totalDistance += Math.round(match.distance || 0);
    save.enemiesDefeatedTotal += match.enemiesDefeated;
    save.perfectDodges += match.perfectDodgesThisRun;
    save.nearMisses += match.nearMissesThisRun;
    save.bestChain = Math.max(save.bestChain, match.chainCount);
    save.bestMultiCollect = Math.max(save.bestMultiCollect, match.bestMultiCollectThisRun);
    if (!match.player.tookDamageThisRun) save.damagelessWins += 1;

    var bossReward = null;
    if (match.bossMode && match.bossDefeated) {
      save.bossesDefeated += 1;
      if (save.boss.defeatedIds.indexOf('overlord') === -1) save.boss.defeatedIds.push('overlord');
      bossReward = { coins: 800, gems: 40, chest: 'legendary' };
    }
    RV.Save.save();

    RV.Progress.updateTrackedStat('matchesThisPeriod', 1, 'add');
    RV.Progress.updateTrackedStat('scoreSumThisPeriod', Math.round(match.score), 'add');
    RV.Progress.updateDailyChallengeStat('perfectDodgesThisPeriod', match.perfectDodgesThisRun, 'add');
    RV.Progress.updateDailyChallengeStat('nearMissesThisPeriod', match.nearMissesThisRun, 'add');
    if (bossReward) {
      RV.Progress.updateTrackedStat('bossesThisPeriod', 1, 'add');
      RV.Progress.grantReward(bossReward);
    }
    RV.Progress.checkAchievements();
    RV.Progress.checkCharacterUnlocks();
    RV.Progress.checkMapUnlocks();
    RV.Progress.checkTitleUnlocks();
    RV.Progress.checkBadgeUnlocks();

    var xpEarned = Math.round(match.score / 12 + match.elapsed * 2 + match.coinsCollected * 0.3);
    var levelUps = RV.Progress.addXP(xpEarned);
    RV.Season.addXP(Math.round(xpEarned * 0.8));

    if (match.bossDefeated) RV.Audio.sfx.achievement();
    else if (isNewBest) RV.Audio.sfx.highScore();
    else RV.Audio.sfx.gameOver();

    lastCompletedReplay = {
      mapId: match.map.id, mapName: match.map.name, characterId: match.character.id,
      score: Math.round(match.score), survivalMs: survivalMs,
      samples: match.replay.samples, moments: match.replay.moments
    };

    fire('gameover', {
      score: Math.round(match.score),
      bestScore: save.bestScore,
      isNewBest: isNewBest,
      coins: match.coinsCollected,
      gems: match.gemsCollected,
      xp: xpEarned,
      combo: match.combo.best,
      survivalMs: survivalMs,
      levelUps: levelUps,
      bossMode: match.bossMode,
      bossDefeated: match.bossDefeated,
      bossReward: bossReward
    });
  }

  RV.GameLoop = {
    init: init, start: start, stop: stop, pause: pause, resume: resume, isPaused: isPaused,
    on: on, ARENA_RADIUS: ARENA_RADIUS,
    getMatch: function () { return match; },
    getLastReplay: function () { return lastCompletedReplay; }
  };
})(window.RV || (window.RV = {}));

/* ==== js/UI/UIManager.js ==== */

  'use strict';

      var el = screens[key].el;
      if (!el) return;
      el.classList.toggle('active', key === name);

      '<div class="curr-pill coin-pill"><span class="curr-icon">&#9679;</span>' + fmt(s.coins) + '</div>' +
      '<div class="curr-pill gem-pill"><span class="curr-icon">&#9670;</span>' + fmt(s.gems) + '</div>' +
      '<div class="level-block">' +
        '<div class="level-badge">LV ' + prog.level + '</div>' +
        '<div class="xp-bar"><div class="xp-fill" style="width:' + Math.round(prog.pct * 100) + '%"></div></div>' +
      '</div>' +
      '<button class="bell-btn" id="notifBellBtn">&#128276;' + (unread > 0 ? '<span class="bell-badge">' + unread + '</span>' : '') + '</button>';
    var bell = document.getElementById('notifBellBtn');

  }

  function fmt(n) {

  var toastQueue = [];

/* ==== js/UI/PhotoMode.js ==== */
/* RUSHVERSE - UI/PhotoMode.js
   Pause-time photo mode: freezes the current match frame (gameplay is
   already paused before this opens), hides the HUD/controls, and lets the
   player pan the camera, zoom/rotate the frame, and cycle a few character
   poses. Panning re-renders the real scene through the camera; zoom/rotate
   are an honest CSS-transform "frame" effect on top of the frozen render,
   not a true free 3D camera (this is a 2D-canvas game). */
(function (RV) {
  'use strict';

  var active = false;
  var toolbar, canvasEl, hudOverlayEl, controlsLayerEl, pauseMenuEl;
  var base = { x: 0, z: 0 };
  var pan = { x: 0, z: 0 };
  var zoom = 1, rotate = 0, poseIndex = 0, uiHidden = false;
  var POSES = [0, Math.PI / 2, Math.PI, -Math.PI / 2];

  function enter(gameScreenEl) {
    var match = RV.GameLoop.getMatch();
    if (!match || active) return;
    active = true;
    base.x = match.player.x; base.z = match.player.z;
    pan.x = 0; pan.z = 0; zoom = 1; rotate = 0; poseIndex = 0; uiHidden = false;

    canvasEl = gameScreenEl.querySelector('#gameCanvas');
    hudOverlayEl = gameScreenEl.querySelector('#hudOverlay');
    controlsLayerEl = gameScreenEl.querySelector('#controlsLayer');
    pauseMenuEl = gameScreenEl.querySelector('#pauseMenu');

    hudOverlayEl.classList.add('photo-hidden');
    controlsLayerEl.classList.add('photo-hidden');
    pauseMenuEl.classList.remove('active');

    toolbar = document.createElement('div');
    toolbar.className = 'photo-toolbar';
    gameScreenEl.appendChild(toolbar);
    renderToolbar();
    applyCamera();
  }

  function exit(gameScreenEl) {
    active = false;
    if (canvasEl) canvasEl.style.transform = '';
    if (toolbar && toolbar.parentNode) toolbar.parentNode.removeChild(toolbar);
    hudOverlayEl.classList.remove('photo-hidden');
    controlsLayerEl.classList.remove('photo-hidden');
    pauseMenuEl.classList.add('active');
  }

  function applyCamera() {
    RV.Camera.follow(base.x + pan.x, base.z + pan.z);
    if (canvasEl) canvasEl.style.transform = 'scale(' + zoom + ') rotate(' + rotate + 'deg)';
  }

  function pan_(dx, dz) { pan.x += dx; pan.z += dz; applyCamera(); }
  function zoomBy(delta) { zoom = Math.max(0.6, Math.min(1.8, zoom + delta)); applyCamera(); }
  function rotateBy(delta) { rotate += delta; applyCamera(); }
  function cyclePose() {
    poseIndex = (poseIndex + 1) % POSES.length;
    var match = RV.GameLoop.getMatch();
    if (match) match.player.facing = POSES[poseIndex];
  }
  function toggleUI() {
    uiHidden = !uiHidden;
    toolbar.classList.toggle('hidden-mode', uiHidden);
  }

  function renderToolbar() {
    toolbar.innerHTML =
      '<div class="photo-row pan-row">' +
        '<button class="photo-btn" data-a="panU">&#8593;</button>' +
      '</div>' +
      '<div class="photo-row pan-row">' +
        '<button class="photo-btn" data-a="panL">&#8592;</button>' +
        '<button class="photo-btn" data-a="panD">&#8595;</button>' +
        '<button class="photo-btn" data-a="panR">&#8594;</button>' +
      '</div>' +
      '<div class="photo-row">' +
        '<button class="photo-btn" data-a="zoomOut">&#8722;</button>' +
        '<button class="photo-btn" data-a="zoomIn">&#43;</button>' +
        '<button class="photo-btn" data-a="rotL">&#8634;</button>' +
        '<button class="photo-btn" data-a="rotR">&#8635;</button>' +
      '</div>' +
      '<div class="photo-row">' +
        '<button class="photo-btn" data-a="pose">POSE</button>' +
        '<button class="photo-btn" data-a="hideui">HIDE UI</button>' +
        '<button class="photo-btn exit-btn" data-a="exit">DONE</button>' +
      '</div>';
    toolbar.querySelectorAll('.photo-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        RV.Audio.sfx.click();
        switch (btn.dataset.a) {
          case 'panU': pan_(0, -0.8); break;
          case 'panD': pan_(0, 0.8); break;
          case 'panL': pan_(-0.8, 0); break;
          case 'panR': pan_(0.8, 0); break;
          case 'zoomIn': zoomBy(0.15); break;
          case 'zoomOut': zoomBy(-0.15); break;
          case 'rotL': rotateBy(-15); break;
          case 'rotR': rotateBy(15); break;
          case 'pose': cyclePose(); break;
          case 'hideui': toggleUI(); break;
          case 'exit': exit(btn.closest('.game-screen')); break;
        }
      });
    });
  }

  RV.PhotoMode = { enter: enter, isActive: function () { return active; } };
})(window.RV || (window.RV = {}));

   and the PLAY button, so a run starts in seconds. */
(function (RV) {

/* ==== js/UI/HUD.js ==== */
/* RUSHVERSE - UI/HUD.js
   Builds the gameplay screen (canvas + touch controls + live HUD overlay),
   drives GameLoop start/stop, and reacts to its callbacks (hud tick, combo
   milestones, event banners, game over). */
(function (RV) {
  'use strict';

  var el, canvas, hudOverlay, controlsLayer;
  var paused = false;

  function build(container) {
    el = document.createElement('div');
    el.className = 'screen game-screen';
    el.innerHTML =
      '<canvas id="gameCanvas"></canvas>' +
      '<div id="hudOverlay" class="hud-overlay">' +
        '<div class="hud-top">' +
          '<button id="pauseBtn" class="hud-pause">&#10073;&#10073;</button>' +
          '<div class="hud-hp" id="hudHp"></div>' +
          '<div class="hud-score-wrap"><div class="hud-score" id="hudScore">0</div><div class="hud-score-label">SCORE</div></div>' +
        '</div>' +
        '<div class="hud-combo" id="hudCombo"></div>' +
        '<div class="hud-banner" id="hudBanner"></div>' +
        '<div class="hud-status-icons" id="hudStatusIcons"></div>' +
      '</div>' +
      '<div id="controlsLayer" class="controls-layer"></div>' +
      '<div id="pauseMenu" class="pause-menu"></div>';
    container.appendChild(el);

    canvas = el.querySelector('#gameCanvas');
    hudOverlay = el.querySelector('#hudOverlay');
    controlsLayer = el.querySelector('#controlsLayer');

    RV.GameLoop.init(canvas);
    RV.Controls.build(controlsLayer);

    el.querySelector('#pauseBtn').addEventListener('click', togglePause);

    RV.GameLoop.on('hud', updateHud);
    RV.GameLoop.on('eventBanner', showBanner);
    RV.GameLoop.on('gameover', onGameOver);

    return { el: el };
  }

  function startMatch(characterId, mapId, skin, extra) {
    paused = false;
    el.querySelector('#pauseMenu').classList.remove('active');
    var opts = { characterId: characterId, mapId: mapId, skin: skin };
    if (extra) for (var k in extra) opts[k] = extra[k];
    RV.GameLoop.start(opts);
  }

  function togglePause() {
    paused = !paused;
    if (paused) { RV.GameLoop.pause(); renderPauseMenu(); }
    else { RV.GameLoop.resume(); el.querySelector('#pauseMenu').classList.remove('active'); }
    RV.Audio.sfx.click();
  }

  function renderPauseMenu() {
    var m = el.querySelector('#pauseMenu');
    m.classList.add('active');
    m.innerHTML =
      '<div class="pause-card">' +
        '<div class="pause-title">PAUSED</div>' +
        '<button class="menu-btn" id="resumeBtn">RESUME</button>' +
        '<button class="menu-btn secondary" id="photoModeBtn">PHOTO MODE</button>' +
        '<button class="menu-btn" id="restartBtn">RESTART</button>' +
        '<button class="menu-btn secondary" id="homeBtn">HOME</button>' +
      '</div>';
    m.querySelector('#resumeBtn').addEventListener('click', togglePause);
    m.querySelector('#photoModeBtn').addEventListener('click', function () {
      RV.Audio.sfx.click();
      RV.PhotoMode.enter(el);
    });
    m.querySelector('#restartBtn').addEventListener('click', function () {
      var match = RV.GameLoop.getMatch();
      togglePause();
      startMatch(match.character.id, match.map.id, match.skin, { bossMode: match.bossMode });
    });
    m.querySelector('#homeBtn').addEventListener('click', function () {
      RV.GameLoop.stop();
      RV.UI.show('home');
    });
  }

  function updateHud(state) {
    var hpEl = document.getElementById('hudHp');
    var pips = '';
    for (var i = 0; i < state.maxHp; i++) pips += '<span class="hp-pip ' + (i < state.hp ? 'full' : 'empty') + '"></span>';
    hpEl.innerHTML = pips;

    document.getElementById('hudScore').textContent = RV.UI.fmt(state.score);

    var comboEl = document.getElementById('hudCombo');
    if (state.combo >= 2) {
      comboEl.style.opacity = 1;
      comboEl.textContent = 'COMBO x' + state.combo;
    } else {
      comboEl.style.opacity = 0;
    }

    var icons = [];
    if (state.shieldActive) icons.push('<span class="status-icon" style="color:#7ad9ff">SHIELD</span>');
    if (state.speedActive) icons.push('<span class="status-icon" style="color:#7dff5a">SPEED</span>');
    if (state.magnetActive) icons.push('<span class="status-icon" style="color:#ff7ad1">MAGNET</span>');
    if (state.multiplierActive) icons.push('<span class="status-icon" style="color:#ffce45">x2 SCORE</span>');
    document.getElementById('hudStatusIcons').innerHTML = icons.join('');
  }

  function showBanner(text) {
    var banner = document.getElementById('hudBanner');
    banner.textContent = text;
    banner.classList.remove('show');
    void banner.offsetWidth;
    banner.classList.add('show');
  }

  function onGameOver(result) {
    RV.UI.show('gameover', result);
  }

  RV.HUD = { build: build, startMatch: startMatch };
})(window.RV || (window.RV = {}));


/* ==== js/UI/GameOverScreen.js ==== */
/* RUSHVERSE - UI/GameOverScreen.js
   End-of-run summary: animated count-up score, NEW HIGH SCORE celebration,
   and the coins/XP/combo/time-survived breakdown. */
(function (RV) {
  'use strict';

  var el;
  var lastResult = null;

  function build(container) {
    el = document.createElement('div');
    el.className = 'screen gameover-screen';
    container.appendChild(el);
    return { el: el, onShow: onShow };
  }

  function onShow(result) {
    lastResult = result;
    var titleHtml = result.bossDefeated
      ? '<div class="new-record-badge boss-badge">BOSS DEFEATED!</div>'
      : (result.isNewBest ? '<div class="new-record-badge">NEW HIGH SCORE!</div>' : '<div class="gameover-title">' + (result.bossMode ? 'BOSS ESCAPED' : 'GAME OVER') + '</div>');
    el.innerHTML =
      '<div class="gameover-card">' +
        titleHtml +
        '<div class="score-reveal" id="scoreReveal">0</div>' +
        '<div class="best-line">BEST ' + RV.UI.fmt(result.bestScore) + '</div>' +
        '<div class="result-grid">' +
          statBlock('COINS EARNED', '+' + RV.UI.fmt(result.coins), '#ffce45') +
          statBlock('XP EARNED', '+' + RV.UI.fmt(result.xp), '#7dff5a') +
          statBlock('BEST COMBO', 'x' + result.combo, '#ff7ad1') +
          statBlock('TIME SURVIVED', RV.UI.fmtTime(result.survivalMs), '#7ad9ff') +
        '</div>' +
        (result.bossReward ? '<div class="boss-bonus-line">BOSS BONUS: +' + result.bossReward.coins + 'c &nbsp;+' + result.bossReward.gems + 'g &nbsp;+ Legendary Chest</div>' : '') +
        '<button class="menu-btn" id="playAgainBtn">PLAY AGAIN</button>' +
        '<div class="btn-row">' +
          '<button class="menu-btn secondary" id="saveRunBtn">SAVE RUN</button>' +
          '<button class="menu-btn secondary" id="goHomeBtn">HOME</button>' +
        '</div>' +
        '<button class="menu-btn secondary" id="goShopBtn">SHOP</button>' +
      '</div>';

    animateScore(result.score);
    if (result.isNewBest || result.bossDefeated) RV.Effects && shakeConfetti();

    renderSavedState();

    if (RV.Challenge.isActive()) {
      var challengeResult = RV.Challenge.resolve(result);
      setTimeout(function () { showChallengeResult(challengeResult); }, 900);
    }

    el.querySelector('#playAgainBtn').addEventListener('click', function () {
      RV.Audio.sfx.click();
      var s = RV.Save.get();
      RV.UI.show('game');
      var match = null;
      RV.HUD.startMatch(s.characters.equipped, s.maps.unlocked[0], {});
    });
    el.querySelector('#goHomeBtn').addEventListener('click', function () { RV.Audio.sfx.click(); RV.UI.show('home'); });
    el.querySelector('#goShopBtn').addEventListener('click', function () { RV.Audio.sfx.click(); RV.UI.show('shop'); });

    if (result.levelUps && result.levelUps.length) {
      setTimeout(function () { RV.LevelUpModal.show(result.levelUps); }, 1200);
    }
  }

  function showChallengeResult(cr) {
    RV.Audio.sfx[cr.won ? 'achievement' : 'warning']();
    var label = cr.type === 'score' ? 'points' : 'ms survived';
    var yourVal = cr.type === 'score' ? RV.UI.fmt(cr.playerValue) : RV.UI.fmtTime(cr.playerValue);
    var oppVal = cr.type === 'score' ? RV.UI.fmt(cr.opponentValue) : RV.UI.fmtTime(cr.opponentValue);
    var card = RV.UI.modal(
      '<div class="levelup-title" style="color:' + (cr.won ? '#7dff5a' : '#ff6a6a') + '">' + (cr.won ? 'CHALLENGE WON!' : 'CHALLENGE LOST') + '</div>' +
      '<div class="challenge-vs-row"><div class="challenge-side"><div class="challenge-name">YOU</div><div class="challenge-value">' + yourVal + '</div></div>' +
      '<div class="challenge-vs">VS</div>' +
      '<div class="challenge-side"><div class="challenge-name">' + cr.friendName + '</div><div class="challenge-value">' + oppVal + '</div></div></div>' +
      '<button class="menu-btn" id="challengeCloseBtn">OK</button>'
    );
    card.querySelector('#challengeCloseBtn').addEventListener('click', function () { RV.Audio.sfx.click(); RV.UI.closeModal(); });
  }

  function renderSavedState() {
    var btn = el.querySelector('#saveRunBtn');
    if (!btn) return;
    var saved = RV.Save.get().replay.lastRun;
    if (saved && saved.score === lastResult.score) {
      btn.textContent = 'WATCH REPLAY';
      btn.onclick = function () { RV.Audio.sfx.click(); RV.UI.show('replay'); };
    } else {
      btn.textContent = 'SAVE RUN';
      btn.onclick = function () {
        RV.Audio.sfx.click();
        var ok = RV.Replay.saveLastRun();
        if (ok) { RV.UI.toast('Run saved!', '#7ad9ff'); renderSavedState(); }
        else RV.UI.toast('Nothing to save yet', '#ff6a6a');
      };
    }
  }

  function statBlock(label, value, color) {
    return '<div class="stat-block"><div class="stat-value" style="color:' + color + '">' + value + '</div><div class="stat-label">' + label + '</div></div>';
  }

  function animateScore(target) {
    var elNode = document.getElementById('scoreReveal');
    var start = performance.now();
    var dur = 1200;
    function step(now) {
      var t = Math.min(1, (now - start) / dur);
      var eased = 1 - Math.pow(1 - t, 3);
      elNode.textContent = RV.UI.fmt(Math.round(target * eased));
      if (t < 1) requestAnimationFrame(step);
      else elNode.textContent = RV.UI.fmt(target);
    }
    requestAnimationFrame(step);
  }

  function shakeConfetti() {
    var layer = document.getElementById('toastLayer');
    for (var i = 0; i < 24; i++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (45 + Math.random() * 10) + '%';
      piece.style.background = ['#ffce45', '#ff7ad1', '#7ad9ff', '#7dff5a'][i % 4];
      piece.style.animationDelay = (Math.random() * 0.3) + 's';
      layer.appendChild(piece);
      setTimeout(function (p) { return function () { p.remove(); }; }(piece), 2200);
    }
  }

  RV.GameOverScreen = { build: build };
})(window.RV || (window.RV = {}));

/* RUSHVERSE - UI/TutorialScreen.js
   Sub-minute first-run tutorial: five quick cards (MOVE, DASH, COLLECT,
   USE ABILITY, SURVIVE), then straight into the player's first match. */
(function (RV) {
  'use strict';

  var el, onDone, step;
  var STEPS = [
    { title: 'MOVE', desc: 'Drag the left stick to run around the arena.', icon: '&#8598;' },
    { title: 'DASH', desc: 'Tap DASH (or swipe) to burst through danger.', icon: '&#187;' },
    { title: 'COLLECT', desc: 'Grab coins and gems to level up faster.', icon: '&#9679;' },
    { title: 'USE ABILITY', desc: 'Tap the Ability button for your character\'s power.', icon: '&#9889;' },
    { title: 'SURVIVE', desc: 'The longer you last, the higher your score.', icon: '&#9733;' }
  ];

  function build(container) {
    el = document.createElement('div');
    el.className = 'screen tutorial-screen';
    container.appendChild(el);
    return { el: el, onShow: onShow };
  }

  function onShow(opts) {
    onDone = opts && opts.onDone;
    step = 0;
    render();
  }

  function render() {
    var s = STEPS[step];
    el.innerHTML =
      '<div class="tutorial-card">' +
        '<div class="tutorial-progress">' + (step + 1) + ' / ' + STEPS.length + '</div>' +
        '<div class="tutorial-icon">' + s.icon + '</div>' +
        '<div class="tutorial-title">' + s.title + '</div>' +
        '<div class="tutorial-desc">' + s.desc + '</div>' +
        '<button class="menu-btn" id="tutorialNext">' + (step === STEPS.length - 1 ? "LET'S GO" : 'NEXT') + '</button>' +
        '<button class="skip-link" id="tutorialSkip">Skip Tutorial</button>' +
      '</div>';
    el.querySelector('#tutorialNext').addEventListener('click', next);
    el.querySelector('#tutorialSkip').addEventListener('click', finish);
  }

  function next() {
    RV.Audio.resume(); RV.Audio.sfx.click();
    step++;
    if (step >= STEPS.length) finish();
    else render();
  }

  function finish() {
    var s = RV.Save.get();
    s.tutorialDone = true;
    RV.Save.save();
    if (onDone) onDone();
  }

  RV.TutorialScreen = { build: build };
})(window.RV || (window.RV = {}));

/* RUSHVERSE - UI/BattlePassScreen.js
   Free + Premium reward tracks driven by Season XP. The Free track always
   stays functionally useful (coins/gems/chests); Premium only adds
   cosmetics and modest currency bonuses on top — never a gameplay
   advantage, so buying it can't win the game for you. */
(function (RV) {
  'use strict';

  var el;

  function build(container) {
    el = document.createElement('div');

  }

  function render() {
    var state = RV.Season.getState();
    el.innerHTML =
      '<div class="screen-title">BATTLE PASS</div>' +
      '<div class="bp-header">' +
        '<div class="bp-season-name">' + state.name + '</div>' +
        '<div class="bp-level-big">LEVEL ' + state.level + ' <span class="bp-level-max">/ ' + state.maxLevel + '</span></div>' +
        '<div class="progress-bar bp-progress"><div class="progress-fill" style="width:' + Math.round(state.pct * 100) + '%"></div></div>' +
        (state.premiumOwned
          ? '<div class="bp-premium-owned">PREMIUM PASS ACTIVE</div>'
          : '<button class="menu-btn bp-buy-btn" id="bpBuyBtn">UNLOCK PREMIUM — ' + RV.Season.PREMIUM_PASS_PRICE.gems + ' <span class="gem-dot"></span></button>') +
      '</div>' +
      '<div class="bp-track-labels"><span>FREE</span><span>PREMIUM</span></div>' +
      '<div class="bp-track" id="bpTrack"></div>';

    var track = el.querySelector('#bpTrack');
    RV.Data.BATTLE_PASS_REWARDS.forEach(function (row) {
      track.appendChild(rowEl(row, state));
    });

    var buyBtn = el.querySelector('#bpBuyBtn');
    if (buyBtn) buyBtn.addEventListener('click', function () {
      var res = RV.Season.purchasePremium();
      if (res.error) RV.UI.toast(res.error, '#ff6a6a');
      else { RV.Audio.sfx.powerup(); RV.UI.toast('Premium Pass unlocked!', '#ffce45'); render(); }
    });

    el.querySelectorAll('.bp-claim-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var res = RV.Season.claimReward(parseInt(btn.dataset.level, 10), btn.dataset.track);
        if (res.error) RV.UI.toast(res.error, '#ff6a6a');
        else { RV.Audio.sfx.achievement(); RV.UI.toast('Reward claimed!', '#7dff5a'); render(); }
      });
    });
  }

  function rowEl(row, state) {
    var wrap = document.createElement('div');
    wrap.className = 'bp-row' + (row.level <= state.level ? ' unlocked' : '');
    wrap.innerHTML =
      '<div class="bp-cell">' + cellHtml(row, 'free', state) + '</div>' +
      '<div class="bp-level-pill">' + row.level + '</div>' +
      '<div class="bp-cell">' + cellHtml(row, 'premium', state) + '</div>';
    return wrap;
  }

  function cellHtml(row, track, state) {
    var reward = row[track];
    var locked = row.level > state.level;
    var needsPremium = track === 'premium' && !state.premiumOwned;
    var claimedList = track === 'premium' ? state.claimedPremium : state.claimedFree;
    var claimed = claimedList.indexOf(row.level) !== -1;
    var label = rewardLabel(reward);
    var cls = 'bp-reward' + (track === 'premium' ? ' premium' : '') + (locked || needsPremium ? ' locked' : '');
    var action = '';
    if (claimed) action = '<div class="bp-claimed">&#10003;</div>';
    else if (locked) action = '';
    else if (needsPremium) action = '<div class="bp-lock-icon">&#128274;</div>';
    else action = '<button class="bp-claim-btn" data-level="' + row.level + '" data-track="' + track + '">CLAIM</button>';
    return '<div class="' + cls + '"><div class="bp-reward-label">' + label + '</div>' + action + '</div>';
  }

  function rewardLabel(reward) {
    var parts = [];
    if (reward.coins) parts.push(reward.coins + 'c');
    if (reward.gems) parts.push(reward.gems + 'g');
    if (reward.chest) parts.push(reward.chest.toUpperCase() + ' CHEST');
    if (reward.skin) parts.push('SKIN');
    return parts.join(' + ') || '—';
  }

  RV.BattlePassScreen = { build: build };
})(window.RV || (window.RV = {}));

    data = RV.Replay.getSaved();
    if (!data || !data.samples || !data.samples.length) {
      el.innerHTML = '<div class="empty-state replay-empty">No saved run yet.<br>Finish a match and tap SAVE RUN.<br><button class="menu-btn" id="replayExitBtn" style="margin-top:16px;max-width:220px">BACK TO HOME</button></div>';
      el.querySelector('#replayExitBtn').addEventListener('click', function () { RV.Audio.sfx.click(); RV.UI.show('home'); });
      return;
    }
    el.innerHTML =
      '<canvas id="replayCanvas"></canvas>' +
      '<div class="replay-hud">' +
        '<div class="replay-hud-top">' +
          '<div class="replay-title">REPLAY &middot; ' + (data.mapName || '') + '</div>' +
          '<div class="replay-score" id="replayScore">0</div>' +
        '</div>' +
        '<div class="replay-time" id="replayTime">0:00 / 0:00</div>' +
      '</div>' +
      '<div class="replay-controls">' +
        '<button class="replay-btn" id="rExit">&#10005;</button>' +
        '<button class="replay-btn" id="rRestart">&#8634;</button>' +
        '<button class="replay-btn wide" id="rPlay">&#10074;&#10074;</button>' +
        '<button class="replay-btn" id="rSpeed">1x</button>' +
        '<button class="replay-btn" id="rCamera">FOLLOW</button>' +
      '</div>';

    canvas = el.querySelector('#replayCanvas');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);

    var duration = data.samples[data.samples.length - 1].t;
    state = { playhead: 0, playing: true, speedIdx: 0, cameraIdx: 0, duration: duration, fired: {} };

    el.querySelector('#rPlay').addEventListener('click', togglePlay);
    el.querySelector('#rRestart').addEventListener('click', restart);
    el.querySelector('#rSpeed').addEventListener('click', cycleSpeed);
    el.querySelector('#rCamera').addEventListener('click', cycleCamera);
    el.querySelector('#rExit').addEventListener('click', exitReplay);

    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function onHide() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    window.removeEventListener('resize', resize);
  }

  function resize() {
    if (!canvas) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    RV.Camera.resize(w, h);
  }

  function togglePlay() {
    state.playing = !state.playing;
    el.querySelector('#rPlay').innerHTML = state.playing ? '&#10074;&#10074;' : '&#9654;';
    RV.Audio.sfx.click();
  }
  function restart() {
    state.playhead = 0; state.playing = true; state.fired = {};
    el.querySelector('#rPlay').innerHTML = '&#10074;&#10074;';
    RV.Audio.sfx.click();
  }
  function cycleSpeed() {
    state.speedIdx = (state.speedIdx + 1) % SPEEDS.length;
    el.querySelector('#rSpeed').textContent = SPEEDS[state.speedIdx] + 'x';
    RV.Audio.sfx.click();
  }
  function cycleCamera() {
    state.cameraIdx = (state.cameraIdx + 1) % CAMERA_MODES.length;
    el.querySelector('#rCamera').textContent = CAMERA_MODES[state.cameraIdx].toUpperCase();
    RV.Audio.sfx.click();
  }
  function exitReplay() {
    RV.Audio.sfx.click();
    RV.UI.show('home');
  }

  function interpolate(t) {
    var samples = data.samples;
    if (t <= samples[0].t) return samples[0];
    for (var i = 1; i < samples.length; i++) {
      if (samples[i].t >= t) {
        var a = samples[i - 1], b = samples[i];
        var span = Math.max(0.001, b.t - a.t);
        var f = (t - a.t) / span;
        return {
          x: a.x + (b.x - a.x) * f, z: a.z + (b.z - a.z) * f,
          facing: a.facing + (b.facing - a.facing) * f,
          hp: a.hp, score: a.score, combo: a.combo
        };
      }
    }
    return samples[samples.length - 1];
  }

  function loop(now) {
    if (!rafId) return;
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    if (state.playing) {
      state.playhead += dt * SPEEDS[state.speedIdx];
      if (state.playhead >= state.duration) { state.playhead = state.duration; state.playing = false; el.querySelector('#rPlay').innerHTML = '&#9654;'; }
    }
    render();
    rafId = requestAnimationFrame(loop);
  }

  function render() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    var mapDef = RV.Data.getMap(data.mapId) || RV.Data.MAPS[0];
    var charDef = RV.Data.getCharacter(data.characterId) || RV.Data.CHARACTERS[0];
    var sample = interpolate(state.playhead);

    var camMode = CAMERA_MODES[state.cameraIdx];
    var camX = sample.x, camZ = sample.z;
    if (camMode === 'cinematic') { camX += Math.sin(state.playhead * 0.4) * 1.8; camZ += Math.cos(state.playhead * 0.3) * 0.6; }
    RV.Camera.follow(camX, camZ);
    var project = function (x, z) { return RV.Camera.project(x, z); };

    RV.Maps.render(ctx, { width: w, height: h }, mapDef, RV.GameLoop.ARENA_RADIUS, project, false);

    var ghost = {
      x: sample.x, z: sample.z, facing: sample.facing, radius: 0.55,
      hp: sample.hp, maxHp: RV.Player.MAX_HP, character: charDef,
      dashTimer: 0, swipeTimer: 0, jumpTimer: 0, invulnTimer: 0, abilityCooldown: 1, abilityActiveTimer: 0,
      status: { shieldTimer: 0, speedTimer: 0, magnetTimer: 0, multiplierTimer: 0, multiplierValue: 1, slowedTimer: 0, secondChance: false }
    };
    RV.Player.draw(ctx, ghost, project, {});

    data.moments.forEach(function (m, idx) {
      if (Math.abs(m.t - state.playhead) < 0.12 && !state.fired[idx + '_' + Math.floor(state.playhead * 4)]) {
        state.fired[idx + '_' + Math.floor(state.playhead * 4)] = true;
        RV.Effects.floatText(m.x, m.z, m.label, m.color, { size: 16, life: 0.9 });
      }
    });
    RV.Effects.update(1 / 60);
    RV.Effects.drawWorldParticles(ctx, project);
    RV.Effects.drawScreenFloaters(ctx, project);

    document.getElementById('replayScore').textContent = RV.UI.fmt(sample.score);
    document.getElementById('replayTime').textContent = RV.UI.fmtTime(state.playhead * 1000) + ' / ' + RV.UI.fmtTime(state.duration * 1000);
  }

  RV.ReplayScreen = { build: build };
})(window.RV || (window.RV = {}));


/* ==== js/Shop/ShopScreen.js ==== */
/* RUSHVERSE - Shop/ShopScreen.js
   Featured (rotates daily) + Characters (unlock via level or coins — never
   gems-only, so nothing here is pay-to-win) + Outfits/Trails/Effects/Emotes.
   Every card shows rarity, price, a live BUY / EQUIP / OWNED state, and a
   Preview before buying. */
(function (RV) {
  'use strict';

  var el;
  var TABS = [
    { id: 'featured', label: 'Featured' },
    { id: 'characters', label: 'Characters' },
    { id: 'outfit', label: 'Outfits' },
    { id: 'trail', label: 'Trails' },
    { id: 'effect', label: 'Effects' },
    { id: 'emote', label: 'Emotes' }
  ];
  var activeTab = 'featured';

  function build(container) {
    el = document.createElement('div');
    el.className = 'screen shop-screen';
    el.innerHTML =
      '<div class="screen-title">SHOP</div>' +
      '<div class="tab-row" id="shopTabs"></div>' +
      '<div class="item-grid" id="shopGrid"></div>';
    container.appendChild(el);

    el.querySelector('#shopTabs').innerHTML = TABS.map(function (t) {
      return '<button class="tab-btn" data-tab="' + t.id + '">' + t.label + '</button>';
    }).join('');
    el.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        RV.Audio.sfx.click();
        activeTab = btn.dataset.tab;
        render();
      });
    });

    return { el: el, onShow: render };
  }

  // Deterministic daily rotation — no server needed, everyone on the same
  // day sees the same featured picks, and they change automatically.
  function getFeaturedItems() {
    var dayKey = Math.floor(Date.now() / 86400000);
    var pool = RV.Data.SHOP_ITEMS.filter(function (it) { return it.price.coins > 0 || it.price.gems > 0; });
    var picks = [];
    var seed = dayKey;
    while (picks.length < 4 && picks.length < pool.length) {
      seed = (seed * 9301 + 49297) % 233280;
      var idx = Math.floor((seed / 233280) * pool.length);
      if (picks.indexOf(pool[idx]) === -1) picks.push(pool[idx]);
    }
    return picks;
  }

  function render() {
    el.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === activeTab); });
    var grid = el.querySelector('#shopGrid');
    grid.innerHTML = '';
    if (activeTab === 'featured') {
      getFeaturedItems().forEach(function (it) { grid.appendChild(cosmeticCard(it, true)); });
    } else if (activeTab === 'characters') {
      RV.Data.CHARACTERS.forEach(function (c) { grid.appendChild(characterCard(c)); });
    } else {
      RV.Data.SHOP_ITEMS.filter(function (it) { return it.cat === activeTab; }).forEach(function (it) {
        grid.appendChild(cosmeticCard(it, false));
      });
    }
  }

  function unlockLabel(u) {
    if (u.type === 'default') return 'STARTER';
    if (u.type === 'level') return 'LEVEL ' + u.value;
    if (u.type === 'coins') return u.value.toLocaleString() + ' COINS';
    return '';
  }

  function characterCard(c) {
    var s = RV.Save.get();
    var owned = s.characters.owned.indexOf(c.id) !== -1;
    var equipped = s.characters.equipped === c.id;
    var card = document.createElement('div');
    card.className = 'item-card rarity-border-' + c.rarity;
    var canBuyWithCoins = !owned && c.unlock.type === 'coins';
    card.innerHTML =
      '<div class="item-preview" style="background:radial-gradient(circle at 35% 30%,' + c.accent + ',' + c.color + ')"></div>' +
      '<div class="item-name">' + c.name + '</div>' +
      '<div class="item-rarity rarity-' + c.rarity + '">' + c.rarity.toUpperCase() + '</div>' +
      '<div class="item-desc">' + c.ability.name + '</div>' +
      (owned
        ? '<button class="item-btn ' + (equipped ? 'owned-btn' : 'buy-btn') + '">' + (equipped ? 'EQUIPPED' : 'EQUIP') + '</button>'
        : canBuyWithCoins
          ? '<button class="item-btn buy-btn">UNLOCK — ' + RV.UI.fmt(c.unlock.value) + ' <span class="coin-dot"></span></button>'
          : '<button class="item-btn locked-btn" disabled>' + unlockLabel(c.unlock) + '</button>');

    var btn = card.querySelector('.item-btn');
    if (owned && !equipped) {
      btn.addEventListener('click', function () {
        RV.Audio.sfx.click();
        s.characters.equipped = c.id; RV.Save.save();
        render();
      });
    } else if (canBuyWithCoins) {
      btn.addEventListener('click', function () {
        if (RV.Progress.spendCoins(c.unlock.value)) {
          RV.Progress.unlockCharacter(c.id);
          RV.Audio.sfx.powerup();
          RV.UI.toast(c.name + ' unlocked!', c.color);
          render();
        } else {
          RV.UI.toast('Not enough coins', '#ff6a6a');
        }
      });
    }
    return card;
  }

  function cosmeticCard(item, featuredBadge) {
    var s = RV.Save.get();
    var owned = s.skins.owned.indexOf(item.id) !== -1;
    var equipped = s.skins.equipped[item.cat] === item.id;
    var priceLabel = item.price.coins != null && item.price.coins > 0 ? RV.UI.fmt(item.price.coins) + ' COINS'
      : item.price.gems ? RV.UI.fmt(item.price.gems) + ' GEMS' : 'FREE';
    var card = document.createElement('div');
    card.className = 'item-card rarity-border-' + item.rarity;
    card.innerHTML =
      (featuredBadge ? '<div class="featured-tag">FEATURED</div>' : '') +
      '<div class="item-preview" style="background:linear-gradient(160deg,' + item.color + ',#0a0e16)"></div>' +
      '<div class="item-name">' + item.name + '</div>' +
      '<div class="item-rarity rarity-' + item.rarity + '">' + item.rarity.toUpperCase() + '</div>' +
      (owned
        ? '<button class="item-btn ' + (equipped ? 'owned-btn' : 'buy-btn') + '">' + (equipped ? 'EQUIPPED' : 'EQUIP') + '</button>'
        : '<div class="item-btn-row">' +
            '<button class="item-btn preview-btn">PREVIEW</button>' +
            '<button class="item-btn buy-btn">BUY — ' + priceLabel + '</button>' +
          '</div>');

    var previewBtn = card.querySelector('.preview-btn');
    if (previewBtn) previewBtn.addEventListener('click', function () { RV.Audio.sfx.click(); openPreview(item); });

    var btn = card.querySelector('.buy-btn, .owned-btn');
    if (owned && !equipped) {
      btn.addEventListener('click', function () {
        RV.Audio.sfx.click();
        s.skins.equipped[item.cat] = item.id; RV.Save.save();
        render();
      });
    } else if (!owned) {
      btn.addEventListener('click', function () {
        var ok = item.price.gems ? RV.Progress.spendGems(item.price.gems) : RV.Progress.spendCoins(item.price.coins || 0);
        if (ok) {
          RV.Progress.acquireSkin(item.id);
          RV.Audio.sfx.powerup();
          RV.UI.toast(item.name + ' purchased!', item.color);
          render();
        } else {
          RV.UI.toast('Not enough currency', '#ff6a6a');
        }
      });
    }
    return card;
  }

  // ---------- Preview: shows the item on the equipped character, rotatable ----------
  var previewFacing = 0;
  function openPreview(item) {
    previewFacing = 0;
    var card = RV.UI.modal(
      '<div class="levelup-title" style="font-size:16px">' + item.name + '</div>' +
      '<canvas id="previewCanvas" width="240" height="240" class="preview-canvas"></canvas>' +
      '<div class="preview-rotate-row">' +
        '<button class="photo-btn" id="prevRotL">&#8634;</button>' +
        '<button class="photo-btn" id="prevRotR">&#8635;</button>' +
      '</div>' +
      '<button class="menu-btn" id="previewCloseBtn">CLOSE</button>'
    );
    var canvas = card.querySelector('#previewCanvas');
    drawPreview(canvas, item);
    card.querySelector('#prevRotL').addEventListener('click', function () { previewFacing -= 0.5; drawPreview(canvas, item); });
    card.querySelector('#prevRotR').addEventListener('click', function () { previewFacing += 0.5; drawPreview(canvas, item); });
    card.querySelector('#previewCloseBtn').addEventListener('click', function () { RV.Audio.sfx.click(); RV.UI.closeModal(); });
  }

  function drawPreview(canvas, item) {
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var grad = ctx.createRadialGradient(120, 190, 10, 120, 190, 120);
    grad.addColorStop(0, 'rgba(124,77,255,0.25)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var s = RV.Save.get();
    var charDef = RV.Data.getCharacter(s.characters.equipped) || RV.Data.CHARACTERS[0];
    var outfitColor = item.cat === 'outfit' ? item.color : (RV.Data.getShopItem(s.skins.equipped.outfit) || {}).color;

    var fakePlayer = {
      x: 0, z: 0, facing: previewFacing, radius: 0.55, hp: 3, maxHp: 3, character: charDef,
      dashTimer: 0, swipeTimer: 0, jumpTimer: 0, invulnTimer: 0, abilityCooldown: 1, abilityActiveTimer: 0,
      status: { shieldTimer: 0, speedTimer: 0, magnetTimer: item.cat === 'effect' ? 1 : 0, multiplierTimer: 0, multiplierValue: 1, slowedTimer: 0, secondChance: false }
    };
    var project = function () { return { x: 120, y: 190, scale: 2.6, cull: false }; };
    RV.Player.draw(ctx, fakePlayer, project, { outfitColor: outfitColor });

    if (item.cat === 'trail') {
      ctx.strokeStyle = item.color;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (var i = 0; i < 6; i++) {
        var a = 120 - i * 14 * Math.cos(previewFacing);
        var b = 190 + 10 + i * 10;
        ctx.lineTo(a, b);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  RV.ShopScreen = { build: build };
})(window.RV || (window.RV = {}));


/* ==== js/Missions/MissionsScreen.js ==== */
/* RUSHVERSE - Missions/MissionsScreen.js
   Mission hub: Daily / Weekly / Season mission tiers, the 3-per-day
   Challenges list, and the sequential Quest Line — all in one screen so
   the bottom nav doesn't need extra slots for each new system. */
(function (RV) {
  'use strict';

  var el;
  var activeTab = 'daily';
  var TABS = [
    { id: 'daily', label: 'Daily' },
    { id: 'weekly', label: 'Weekly' },
    { id: 'season', label: 'Season' },
    { id: 'challenges', label: 'Challenges' },
    { id: 'quests', label: 'Quests' }
  ];

  function build(container) {
    el = document.createElement('div');
    el.className = 'screen missions-screen';
    el.innerHTML =
      '<div class="screen-title">MISSIONS</div>' +
      '<div class="tab-row" id="missionTabs">' + TABS.map(function (t) {
        return '<button class="tab-btn" data-tab="' + t.id + '">' + t.label + '</button>';
      }).join('') + '</div>' +
      '<div class="list-col" id="missionList"></div>';
    container.appendChild(el);

    el.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { RV.Audio.sfx.click(); activeTab = btn.dataset.tab; render(); });
    });

    return { el: el, onShow: render };
  }

  function render() {
    el.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === activeTab); });
    var list = el.querySelector('#missionList');
    if (activeTab === 'quests') { list.innerHTML = renderQuests(); bindQuestButtons(); return; }
    if (activeTab === 'challenges') { list.innerHTML = renderMissionRows(RV.Progress.getDailyChallenges(), 'challenge'); bindClaimButtons('challenge'); return; }
    var missions = RV.Progress.getMissions()[activeTab];
    list.innerHTML = renderMissionRows(missions, activeTab);
    bindClaimButtons(activeTab);
  }

  function renderMissionRows(missions, kind) {
    if (!missions.length) return '<div class="empty-state">Nothing here right now — check back soon.</div>';
    return missions.map(function (m) {
      var pct = Math.min(100, Math.round(m.progress / m.target * 100));
      var action = m.claimed ? '<span class="claimed-tag">CLAIMED</span>'
        : m.complete ? '<button class="item-btn buy-btn claim-mission-btn" data-kind="' + kind + '" data-id="' + m.id + '">CLAIM</button>'
        : '';
      return '<div class="mission-row">' +
        '<div class="mission-info"><div class="mission-name">' + m.desc + '</div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="progress-label">' + RV.UI.fmt(m.progress) + ' / ' + RV.UI.fmt(m.target) + '</div></div>' +
        '<div class="mission-reward">' + rewardText(m.reward) + action + '</div></div>';
    }).join('');
  }

  function bindClaimButtons(kind) {
    el.querySelectorAll('.claim-mission-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var reward = kind === 'challenge'
          ? RV.Progress.claimDailyChallenge(btn.dataset.id)
          : RV.Progress.claimMission(btn.dataset.kind, btn.dataset.id);
        if (reward) { RV.Audio.sfx.achievement(); RV.UI.toast('Reward claimed!', '#7dff5a'); render(); }
      });
    });
  }

  function renderQuests() {
    var state = RV.Progress.getQuestState();
    var completedHtml = state.completedQuests.map(function (q) {
      return '<div class="quest-row done"><span class="quest-check">&#10003;</span><div class="quest-info"><div class="quest-name">' + q.name + '</div><div class="quest-desc">' + q.desc + '</div></div></div>';
    }).join('');

    var currentHtml = '';
    if (state.current) {
      var c = state.current;
      var pct = Math.min(100, Math.round(c.progress / c.target * 100));
      currentHtml = '<div class="quest-row active">' +
        '<div class="quest-info"><div class="quest-name">' + c.name + '</div><div class="quest-desc">' + c.desc + '</div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="progress-label">' + RV.UI.fmt(c.progress) + ' / ' + RV.UI.fmt(c.target) + '</div></div>' +
        '<div class="mission-reward">' + rewardText(c.reward) +
        (c.complete ? '<button class="item-btn buy-btn claim-quest-btn">CLAIM</button>' : '') + '</div></div>';
    }

    var finalHtml = '';
    if (state.done) {
      finalHtml = '<div class="quest-final-banner">' +
        (state.claimedFinal
          ? '<div class="claimed-tag">SPECIAL REWARD CLAIMED</div>'
          : '<div class="levelup-title" style="font-size:16px">SPECIAL REWARD UNLOCKED!</div><button class="item-btn buy-btn claim-final-btn">CLAIM</button>') +
        '</div>';
    }

    return completedHtml + currentHtml + finalHtml;
  }

  function bindQuestButtons() {
    var claimBtn = el.querySelector('.claim-quest-btn');
    if (claimBtn) claimBtn.addEventListener('click', function () {
      var reward = RV.Progress.claimCurrentQuest();
      if (reward) { RV.Audio.sfx.achievement(); RV.UI.toast('Quest complete!', '#7dff5a'); render(); }
    });
    var finalBtn = el.querySelector('.claim-final-btn');
    if (finalBtn) finalBtn.addEventListener('click', function () {
      var reward = RV.Progress.claimFinalQuestReward();
      if (reward) { RV.Audio.sfx.achievement(); RV.UI.toast('Special reward claimed!', '#ffce45'); render(); }
    });
  }

  function rewardText(reward) {
    var parts = [];
    if (reward.coins) parts.push('+' + reward.coins + 'c');
    if (reward.gems) parts.push('+' + reward.gems + 'g');
    if (reward.chest) parts.push(reward.chest + ' chest');
    return '<div class="reward-chip">' + parts.join(' ') + '</div>';
  }

  RV.MissionsScreen = { build: build };
})(window.RV || (window.RV = {}));


/* ==== js/Missions/DailyReward.js ==== */
/* RUSHVERSE - Missions/DailyReward.js
   7-day login streak. Checked once on boot; shows a modal if today's
   reward hasn't been claimed yet. Missing a day resets the streak to 1
   (still lets them claim), it never blocks play. */
(function (RV) {
  'use strict';

  var DAY_MS = 86400000;

  function checkAndMaybeShow() {
    var s = RV.Save.get();
    var today = Math.floor(Date.now() / DAY_MS);
    var lastDay = Math.floor((s.dailyReward.lastClaim || 0) / DAY_MS);
    if (lastDay === today) return; // already claimed today

    var streak = s.dailyReward.streak || 0;
    var isConsecutive = lastDay === today - 1;
    var newStreak = isConsecutive ? streak + 1 : 1;
    if (newStreak > 7) newStreak = 1;
    RV.Progress.addNotification('DAILY REWARD READY', 'event');
    show(newStreak);
  }

  function show(dayNumber) {
    var def = RV.Data.DAILY_REWARDS[dayNumber - 1];
    var label = rewardLabel(def);
    var row = RV.Data.DAILY_REWARDS.map(function (d) {
      var cls = d.day === dayNumber ? 'daily-cell active' : d.day < dayNumber ? 'daily-cell done' : 'daily-cell';
      return '<div class="' + cls + '"><div class="daily-day">DAY ' + d.day + '</div><div class="daily-icon">' + dailyIcon(d) + '</div></div>';
    }).join('');

    var currentStreak = RV.Save.get().dailyReward.streak || 0;
