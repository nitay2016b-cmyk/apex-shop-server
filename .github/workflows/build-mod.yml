name: Build Minecraft mod

on:
  push:
    paths:
      - 'mortal-kombat-heroes-mod/**'
      - '.github/workflows/build-mod.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mortal-kombat-heroes-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mortal-kombat-heroes-mod
          path: mortal-kombat-heroes-mod/build/libs/*.jar
