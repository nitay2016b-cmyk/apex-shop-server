<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RUSHVERSE</title>
<meta name="description" content="RUSHVERSE — fast-paced third-person arena action for mobile.">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060810">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%237c4dff'/%3E%3Cpath d='M30 70 L55 30 L48 30 L70 30 L45 70 Z' fill='%2300e5ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Global error boundary: loaded before any game script, so a genuine
       crash anywhere shows a friendly retry screen instead of a blank page
       or a raw stack trace. -->
  <script>
    (function () {
      var shown = false;
      function showErrorScreen() {
        if (shown) return;
        shown = true;
        var boot = document.getElementById('bootLoader');
        if (boot) boot.classList.add('hidden');
        var el = document.createElement('div');
        el.id = 'crashScreen';
        el.innerHTML =
          '<div class="crash-card">' +
            '<div class="crash-title">Something went wrong.</div>' +
            '<div class="crash-desc">Please try again.</div>' +
            '<button class="menu-btn" id="crashRetryBtn">RETRY</button>' +
          '</div>';
        document.body.appendChild(el);
        document.getElementById('crashRetryBtn').addEventListener('click', function () {
          window.location.reload();
        });
      }
      window.addEventListener('error', showErrorScreen);
      window.addEventListener('unhandledrejection', showErrorScreen);
    })();
  </script>

  <div id="bootLoader">
    <div class="boot-title">RUSH<span style="color:#00e5ff">VERSE</span></div>
    <div class="boot-spinner"></div>
    <div class="boot-tip" id="bootTip"></div>
  </div>

  <div id="app">
    <div id="topHeader"></div>
    <div id="stage"></div>
    <div id="bottomNav"></div>
  </div>

  <div id="toastLayer"></div>
  <div id="modalLayer"></div>

  <!-- Data layer -->
  <script src="js/Data/SaveSystem.js"></script>
  <script src="js/Data/GameData.js"></script>
  <script src="js/Data/Progression.js"></script>
  <script src="js/Data/Season.js"></script>

  <!-- Audio / Effects -->
  <script src="js/Audio/AudioManager.js"></script>
  <script src="js/Effects/Effects.js"></script>

  <!-- Core game engine -->
  <script src="js/Game/Camera.js"></script>
  <script src="js/Player/Controls.js"></script>
  <script src="js/Player/Player.js"></script>
  <script src="js/Enemies/Enemy.js"></script>
  <script src="js/Items/Obstacles.js"></script>
  <script src="js/Items/Pickups.js"></script>
  <script src="js/Maps/Maps.js"></script>
  <script src="js/Game/Combo.js"></script>
  <script src="js/Game/Events.js"></script>
  <script src="js/Game/GameLoop.js"></script>
  <script src="js/Game/Replay.js"></script>

  <!-- UI shell -->
  <script src="js/UI/UIManager.js"></script>
  <script src="js/UI/Notifications.js"></script>

  <script src="js/UI/LevelUpModal.js"></script>
  <script src="js/UI/TutorialScreen.js"></script>
  <script src="js/UI/CollectionScreen.js"></script>
  <script src="js/UI/BattlePassScreen.js"></script>
  <script src="js/UI/EventsScreen.js"></script>
  <script src="js/UI/BossScreen.js"></script>
  <script src="js/UI/ProfileScreen.js"></script>
  <script src="js/UI/ReplayScreen.js"></script>

  <!-- Feature screens -->
  <script src="js/Shop/ShopScreen.js"></script>
  <script src="js/Missions/MissionsScreen.js"></script>
  <script src="js/Missions/DailyReward.js"></script>
  <script src="js/Leaderboard/LeaderboardData.js"></script>
  <script src="js/Leaderboard/Challenge.js"></script>
  <script src="js/Leaderboard/Party.js"></script>
  <script src="js/Leaderboard/LeaderboardScreen.js"></script>
  <script src="js/UI/PartyScreen.js"></script>
  <script src="js/Settings/SettingsScreen.js"></script>

  <script src="js/main.js"></script>
</body>
</html>
